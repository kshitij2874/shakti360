<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Kalpana — Guiding Dreams, Empowering Decisions</title>
  <meta name="description" content="Kalpana: Multi-agent AI companion for women across Health, Finance, and Career life pillars."/>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script type="module">

    const firebaseConfig = {
      apiKey: "AIzaSyBOOY4rQpuOlkv9ykuojls-g4NQkiJctQI",

      storageBucket: "shakti360.firebasestorage.app",

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            heading: ['Playfair Display', 'Georgia', 'serif'],
          },
          colors: {
            kalpana: {
              50:'#fff5f7', 100:'#ffe0e9', 200:'#fbcfe8', 300:'#f9a8c3',
              400:'#f472b6', 500:'#e94e8a', 600:'#db2777', 700:'#b03168',
              800:'#8B1538', 900:'#831843',
            },
            rose: { 50:'#fff5f7', 100:'#ffe0e9', 300:'#f9a8c3', 500:'#e94e8a', 700:'#b03168' },
            health: { light:'#ffe0e9', DEFAULT:'#e94e8a', dark:'#b03168' },
            finance: { light:'#fef3e2', DEFAULT:'#f4c785', dark:'#b8772b' },
            career: { light:'#e8f0e6', DEFAULT:'#a7c4a0', dark:'#4a7a3f' },
          }
        }
      }
    }
  </script>
  <style>
    :root {
      --kalpana-rose-50: #fff5f7;
      --kalpana-rose-100: #ffe0e9;
      --kalpana-rose-300: #f9a8c3;
      --kalpana-rose-500: #e94e8a;
      --kalpana-rose-700: #b03168;
      --kalpana-burgundy: #8B1538;
      --kalpana-lavender: #c4b5fd;
      --kalpana-sage: #a7c4a0;
      --kalpana-amber: #f4c785;
      --kalpana-bg: #fffafb;
      --kalpana-text: #2d1f24;
      --kalpana-text-soft: #6b5560;
      --kalpana-card-shadow: 0 4px 20px rgba(233, 78, 138, 0.08);
    }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--kalpana-bg);
      color: var(--kalpana-text);
    }

    h1, h2, h3, .font-heading {
      font-family: 'Playfair Display', Georgia, serif;
    }

    .kalpana-card {
      background: white;
      border-radius: 20px;
      box-shadow: var(--kalpana-card-shadow);
      border: 1px solid var(--kalpana-rose-100);
    }

    .kalpana-btn-primary {
      background: var(--kalpana-rose-500);
      color: white;
      padding: 10px 20px;
      border-radius: 12px;
      font-weight: 500;
      transition: all 0.2s;
    }

    .kalpana-btn-primary:hover {
      background: var(--kalpana-rose-700);
      transform: translateY(-1px);
    }

    .kalpana-btn-secondary {
      background: white;
      color: var(--kalpana-rose-700);
      border: 1.5px solid var(--kalpana-rose-300);
      padding: 10px 20px;
      border-radius: 12px;
      font-weight: 500;
      transition: all 0.2s;
    }

    .kalpana-btn-secondary:hover {
      background: var(--kalpana-rose-50);
    }

    .kalpana-bubble-user {
      background: var(--kalpana-rose-100);
      color: var(--kalpana-text);
      border-radius: 20px 20px 4px 20px;
      padding: 14px 18px;
      max-width: 80%;
    }

    .kalpana-bubble-bot {
      background: white;
      border: 1px solid var(--kalpana-rose-100);
      border-radius: 20px 20px 20px 4px;
      padding: 14px 18px;
      max-width: 80%;
    }

    .kalpana-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 600;
    }

    .kalpana-badge-health {
      background: rgba(233, 78, 138, 0.1);
      color: var(--kalpana-rose-700);
    }

    .kalpana-badge-finance {
      background: rgba(244, 199, 133, 0.2);
      color: #b8772b;
    }

    .kalpana-badge-career {
      background: rgba(167, 196, 160, 0.2);
      color: #4a7a3f;
    }

    .kalpana-source-chip {
      display: inline-block;
      padding: 3px 10px;
      background: var(--kalpana-rose-50);
      color: var(--kalpana-rose-700);
      border: 1px solid var(--kalpana-rose-100);
      border-radius: 8px;
      font-size: 11px;
      font-weight: 600;
      margin-right: 6px;
      cursor: pointer;
    }

    .kalpana-thinking {
      color: var(--kalpana-rose-500);
      font-style: italic;
      animation: kalpana-pulse 1.5s ease-in-out infinite;
    }

    @keyframes kalpana-pulse {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }

    @keyframes pulse-dot { 0%,100%{opacity:1} 50%{opacity:0.3} }
    .thinking-dot { animation: pulse-dot 1.2s ease-in-out infinite; }
    @keyframes fade-in { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
    .fade-in { animation: fade-in 0.3s ease-out; }

    /* Branded "Kalpana is thinking" lotus animation */
    @keyframes lotus-breathe {
      0%, 100% { transform: scale(1); opacity: 0.85; }
      50% { transform: scale(1.12); opacity: 1; }
    }
    @keyframes lotus-spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .lotus-thinking { animation: lotus-breathe 1.6s ease-in-out infinite; transform-origin: center; }
    .lotus-thinking-spin { animation: lotus-spin 6s linear infinite; transform-origin: center; }

    /* Smooth state transitions */
    @keyframes slide-up {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .slide-up { animation: slide-up 0.22s ease-out; }

    @keyframes question-fade {
      from { opacity: 0; transform: translateX(-6px); }
      to   { opacity: 1; transform: translateX(0); }
    }
    .question-fade { animation: question-fade 0.3s ease-out; }

    .collapse-out {
      max-height: 0;
      opacity: 0;
      overflow: hidden;
      transition: max-height 0.3s ease, opacity 0.2s ease;
    }

    /* Trust strip */
    .trust-strip {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      max-width: 720px;
      margin: 24px auto 0;
      padding: 16px;
    }
    .trust-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      background: white;
      border: 1px solid var(--kalpana-rose-100);
      border-radius: 14px;
      box-shadow: 0 1px 4px rgba(233, 78, 138, 0.04);
    }
    .trust-item svg { flex-shrink: 0; }
    .trust-item .trust-text { display: flex; flex-direction: column; min-width: 0; }
    .trust-item strong {
      font-size: 12px;
      font-weight: 600;
      color: var(--kalpana-rose-700);
      line-height: 1.2;
    }
    .trust-item .trust-sub {
      font-size: 11px;
      color: var(--kalpana-text-soft);
      line-height: 1.2;
      margin-top: 2px;
    }

    /* Mobile (<= 480px) */
    @media (max-width: 480px) {
      .trust-strip { grid-template-columns: 1fr; gap: 8px; padding: 12px; }
      .trust-item { padding: 10px 12px; }
      .kalpana-bubble-user, .kalpana-bubble-bot { max-width: 92%; padding: 12px 14px; }
      .kalpana-card { border-radius: 16px; }
    }
    @media (max-width: 380px) {
      .trust-item strong { font-size: 11px; }
      .trust-item .trust-sub { font-size: 10px; }
    }

    ::-webkit-scrollbar { width:6px }
    ::-webkit-scrollbar-track { background:transparent }
    ::-webkit-scrollbar-thumb { background: var(--kalpana-rose-100); border-radius:3px }
    ::-webkit-scrollbar-thumb:hover { background: var(--kalpana-rose-300); }
  </style>
</head>
<body class="font-sans min-h-screen">
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;
const API = window.location.origin;

// ─── Kalpana Lotus Logo ───
function KalpanaLogo({ size = 40, animated = false }) {
  return (
    <svg width={size} height={size} viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg"
      className={animated ? 'lotus-thinking' : ''}>
      <defs>
        <linearGradient id="kg" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stopColor="#f9a8c3" />
          <stop offset="100%" stopColor="#e94e8a" />
        </linearGradient>
      </defs>
      <path d="M50 85 Q30 75 25 50 Q35 55 50 65 Q65 55 75 50 Q70 75 50 85 Z" fill="url(#kg)" />
      <path d="M50 75 Q35 60 35 35 Q42 40 50 55 Q58 40 65 35 Q65 60 50 75 Z" fill="url(#kg)" opacity="0.85" />
      <ellipse cx="50" cy="40" rx="6" ry="20" fill="url(#kg)" opacity="0.9" />
      <circle cx="50" cy="22" r="3" fill="#b03168" />
    </svg>
  );
}

// ─── Branded "Kalpana is thinking..." ───
function KalpanaThinking({ label }) {
  return (
    <div className="flex items-center gap-3 px-4 py-2 fade-in">
      <KalpanaLogo size={26} animated={true}/>
      <span className="text-sm italic" style={{color:'var(--kalpana-rose-700)'}}>
        {label || 'Kalpana is thinking'}
      </span>
      <span className="thinking-dot inline-block w-1.5 h-1.5 rounded-full" style={{background:'var(--kalpana-rose-500)'}}></span>
      <span className="thinking-dot inline-block w-1.5 h-1.5 rounded-full" style={{background:'var(--kalpana-rose-500)', animationDelay:'0.2s'}}></span>
      <span className="thinking-dot inline-block w-1.5 h-1.5 rounded-full" style={{background:'var(--kalpana-rose-500)', animationDelay:'0.4s'}}></span>
    </div>
  );
}

// ─── Trust Strip — 3 trust badges shown on empty states + sign-in ───
function TrustStrip() {
  return (
    <div className="trust-strip fade-in">
      <div className="trust-item">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" style={{color:'var(--kalpana-rose-500)'}}>
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        </svg>
        <div className="trust-text">
          <strong>Verified Sources</strong>
          <span className="trust-sub">NHM &middot; AIIMS &middot; WHO</span>
        </div>
      </div>
      <div className="trust-item">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" style={{color:'var(--kalpana-rose-500)'}}>
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
        <div className="trust-text">
          <strong>Private &amp; Secure</strong>
          <span className="trust-sub">Your data is safe</span>
        </div>
      </div>
      <div className="trust-item">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" style={{color:'var(--kalpana-rose-500)'}}>
          <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
        </svg>
        <div className="trust-text">
          <strong>Made for You</strong>
          <span className="trust-sub">Personalized guidance</span>
        </div>
      </div>
    </div>
  );
}

// ─── Pillar Config (Kalpana palette) ───
const PILLAR_STYLES = {
  HEALTH:  { badge:'kalpana-badge-health',  icon:'🌸', label:'Health' },
  FINANCE: { badge:'kalpana-badge-finance', icon:'💰', label:'Finance' },
  CAREER:  { badge:'kalpana-badge-career',  icon:'🌿', label:'Career' },
};

// ─── Thinking Indicator ───
function ThinkingIndicator({ steps }) {
  const current = steps[steps.length - 1];
  if (!current) return null;
  return (
    <div className="flex items-center gap-2 px-4 py-2 text-sm fade-in">
      <span className="thinking-dot inline-block w-2 h-2 rounded-full" style={{background:'var(--kalpana-rose-500)'}}></span>
      <span className="thinking-dot inline-block w-2 h-2 rounded-full" style={{background:'var(--kalpana-rose-500)', animationDelay:'0.2s'}}></span>
      <span className="thinking-dot inline-block w-2 h-2 rounded-full" style={{background:'var(--kalpana-rose-500)', animationDelay:'0.4s'}}></span>
      <span className="ml-1 kalpana-thinking">{current.detail}</span>
    </div>
  );
}

// ─── Citation Chips ───
function CitationChips({ chips, citations }) {
  // Prefer structured chips ({label, source, section}); fall back to legacy strings
  let items = [];
  if (Array.isArray(chips) && chips.length > 0) {
    items = chips.map(c => ({
      label: (c.label || '').toString().substring(0, 30),
      title: c.source || c.section || '',
      kind: c.kind || 'official',
    }));
  } else if (Array.isArray(citations) && citations.length > 0) {
    items = citations.map(c => {
      const label = (c || '').replace(/\[Source:\s*/i, '').replace(/\]$/, '').split(',')[0].trim().substring(0, 30);
      return { label, title: c, kind: 'official' };
    });
  }
  if (items.length === 0) return null;
  const isWeb = items.some(it => it.kind === 'web');
  return (
    <div className="mt-3">
      <div className="flex flex-wrap gap-1.5">
        {items.map((it, i) => (
          <span key={i} className="kalpana-source-chip" title={it.title}
            style={it.kind === 'web' ? {borderStyle:'dashed'} : undefined}>
            {it.kind === 'web' ? '🌐 ' : '✓ '}{it.label}
          </span>
        ))}
      </div>
      <div className="text-[10px] mt-1.5" style={{color:'var(--kalpana-text-soft)'}}>
        {isWeb
          ? '🌐 From a live web search — please verify before acting on it.'
          : '✓ From verified government & trusted sources.'}
      </div>
    </div>
  );
}

// ─── Next-Step Suggestion Cards ───
function NextStepsCards({ steps, onPick }) {
  if (!Array.isArray(steps) || steps.length === 0) return null;
  return (
    <div className="mt-4 space-y-2">
      {steps.map((s, i) => (
        <button key={i} onClick={() => onPick && onPick(s)}
          className="w-full text-left rounded-xl px-4 py-3 text-sm transition-all hover:-translate-y-0.5 flex items-center justify-between gap-3"
          style={{background:'white', border:'1.5px solid var(--kalpana-rose-100)', color:'var(--kalpana-text)', boxShadow:'0 1px 3px rgba(233, 78, 138, 0.05)'}}>
          <span className="flex-1">{s.label}</span>
          <span style={{color:'var(--kalpana-rose-500)'}}>→</span>
        </button>
      ))}
    </div>
  );
}

// ─── Feedback Bar ───
function FeedbackBar({ onFeedback }) {
  const [chosen, setChosen] = useState(null);
  if (chosen) {
    return (
      <div className="mt-3 text-xs italic" style={{color:'var(--kalpana-text-soft)'}}>
        Thanks for the feedback.
      </div>
    );
  }
  const pick = (v) => { setChosen(v); if (onFeedback) onFeedback(v); };
  return (
    <div className="flex items-center gap-3 mt-3 text-xs" style={{color:'var(--kalpana-text-soft)'}}>
      <span>Was this helpful?</span>
      <button onClick={() => pick('up')} className="hover:scale-110 transition" title="Helpful">👍</button>
      <button onClick={() => pick('down')} className="hover:scale-110 transition" title="Not helpful">👎</button>
    </div>
  );
}

// ─── Approval Card — friendly, no raw JSON ───
const TOOL_LABELS = {
  find_nearby_clinic: { icon:'🏥', name:'Find nearby clinics' },
  find_nearby_police: { icon:'🚓', name:'Find nearby help & police' },
  lookup_scheme:      { icon:'📋', name:'Look up a government scheme' },
  calculate_sip:      { icon:'🧮', name:'Run a SIP calculation' },
  get_helplines:      { icon:'📞', name:'Share helpline numbers' },
  search_jobs_web:    { icon:'💼', name:'Search job listings' },
  analyze_budget:     { icon:'📊', name:'Analyze budget & spending' },
  assess_health_risk: { icon:'🩺', name:'Health risk assessment' },
  check_scheme_eligibility: { icon:'✅', name:'Check scheme eligibility' },
  mental_wellbeing_check:   { icon:'🧠', name:'Mental wellbeing check' },
  tavily_web_search:  { icon:'🔍', name:'Search the web' },
  tavily_search_health:  { icon:'🔍', name:'Search health information' },
  tavily_search_finance: { icon:'🔍', name:'Search financial information' },
  tavily_search_career:  { icon:'🔍', name:'Search career information' },
  find_support_org:   { icon:'🤝', name:'Connect with real support' },
};

function ApprovalCard({ tools, sessionId, onApprove, onReject }) {
  return (
    <div className="rounded-xl p-4 my-3 slide-up" style={{background:'#fef9e7', border:'1px solid #f4c785'}}>
      <div className="flex items-center gap-2 mb-3">
        <span className="text-lg">🌸</span>
        <h4 className="font-semibold text-sm" style={{color:'#b8772b'}}>Kalpana would like to help with:</h4>
      </div>
      <div className="space-y-2 mb-4">
        {tools.map((t, i) => {
          const meta = TOOL_LABELS[t.tool] || { icon:'✨', name: t.tool.replace(/_/g,' ') };
          return (
            <div key={i} className="rounded-lg p-3 text-sm" style={{background:'white', border:'1px solid var(--kalpana-rose-100)'}}>
              <div className="font-medium" style={{color:'#b8772b'}}>{meta.icon} {meta.name}</div>
              {t.reason && <div className="mt-1 text-xs" style={{color:'var(--kalpana-text-soft)'}}>{t.reason}</div>}
            </div>
          );
        })}
      </div>
      <div className="flex gap-2">
        <button onClick={() => onApprove(sessionId)} className="kalpana-btn-primary flex-1 text-sm">Yes, go ahead</button>
        <button onClick={() => onReject(sessionId)} className="kalpana-btn-secondary flex-1 text-sm">No thanks</button>
      </div>
    </div>
  );
}

// ─── Tool Result Card — pretty render of approved tool results ───
function ToolResultCard({ results, onRetry }) {
  if (!results || results.length === 0) return null;
  return (
    <div className="rounded-xl p-4 my-2 slide-up" style={{background:'var(--kalpana-rose-50)', border:'1px solid var(--kalpana-rose-100)'}}>
      <div className="text-xs font-medium mb-3 font-heading" style={{color:'var(--kalpana-rose-700)'}}>✓ Here's what I found</div>
      {results.map((r, i) => (
        <ToolResultBlock key={i} tool={r.tool} result={r.result} onRetry={onRetry} />
      ))}
    </div>
  );
}

function ToolResultBlock({ tool, result, onRetry }) {
  const meta = TOOL_LABELS[tool] || { icon:'✨', name: (tool||'').replace(/_/g,' ') };

  // List of places (clinics / police)
  if (Array.isArray(result)) {
    return (
      <div className="mb-2">
        <div className="text-xs mb-2" style={{color:'var(--kalpana-text-soft)'}}>{meta.icon} {meta.name}</div>
        <div className="space-y-2">
          {result.slice(0, 5).map((p, i) => (
            <div key={i} className="rounded-lg p-3 text-sm" style={{background:'white', border:'1px solid var(--kalpana-rose-100)'}}>
              <div className="font-medium" style={{color:'var(--kalpana-text)'}}>{p.name || p.label || 'Place'}</div>
              {p.address && <div className="text-xs mt-0.5" style={{color:'var(--kalpana-text-soft)'}}>{p.address}</div>}
              <div className="flex gap-3 mt-1 text-xs" style={{color:'var(--kalpana-text-soft)'}}>
                {p.rating && p.rating !== 'N/A' && <span>★ {p.rating}</span>}
                {p.phone && <span>📞 {p.phone}</span>}
                {p.open_now === true && <span style={{color:'#4a7a3f'}}>Open now</span>}
              </div>
            </div>
          ))}
        </div>
      </div>
    );
  }

  // Warm human handoff — support organisations
  if (result && typeof result === 'object' && Array.isArray(result.organisations)) {
    return (
      <div className="mb-2">
        {result.intro && <div className="text-sm mb-2" style={{color:'var(--kalpana-text)'}}>{result.intro}</div>}
        <div className="space-y-2">
          {result.organisations.map((o, i) => (
            <div key={i} className="rounded-lg p-3 text-sm" style={{background:'white', border:'1px solid var(--kalpana-rose-100)'}}>
              <div className="font-medium" style={{color:'var(--kalpana-rose-700)'}}>{o.name}</div>
              {o.helps_with && <div className="text-xs mt-0.5" style={{color:'var(--kalpana-text-soft)'}}>{o.helps_with}</div>}
              <div className="flex gap-3 mt-1 text-xs flex-wrap">
                {o.phone && <a href={`tel:${(o.phone||'').replace(/[^0-9+]/g,'')}`} style={{color:'#b8772b'}}>📞 {o.phone}</a>}
                {o.contact && (/\./.test(o.contact)
                  ? <a href={`https://${o.contact.replace(/^https?:\/\//,'')}`} target="_blank" rel="noopener" style={{color:'var(--kalpana-rose-500)'}}>🔗 {o.contact}</a>
                  : <span style={{color:'var(--kalpana-text-soft)'}}>{o.contact}</span>)}
              </div>
            </div>
          ))}
        </div>
      </div>
    );
  }

  // Scheme lookup result
  if (result && typeof result === 'object' && (result.found !== undefined || result.name)) {
    if (result.found === false) {
      return (
        <div className="rounded-lg p-3 text-sm mb-2" style={{background:'white', border:'1px solid var(--kalpana-rose-100)', color:'var(--kalpana-text-soft)'}}>
          {result.message || 'No matching scheme found.'}
        </div>
      );
    }
    return (
      <div className="rounded-lg p-3 mb-2" style={{background:'white', border:'1px solid var(--kalpana-rose-100)'}}>
        <div className="font-semibold text-sm mb-1" style={{color:'var(--kalpana-rose-700)'}}>{meta.icon} {result.name}</div>
        {result.type && <div className="text-xs mb-2" style={{color:'var(--kalpana-text-soft)'}}>{result.type}</div>}
        {result.eligibility && <div className="text-xs"><strong>Eligibility:</strong> {result.eligibility}</div>}
        {result.benefit && <div className="text-xs mt-1"><strong>Benefit:</strong> {result.benefit}</div>}
        {result.where && <div className="text-xs mt-1"><strong>Where:</strong> {result.where}</div>}
        {result.url && (
          <a href={result.url} target="_blank" rel="noopener" className="inline-block mt-2 text-xs hover:underline" style={{color:'var(--kalpana-rose-500)'}}>
            Visit official page →
          </a>
        )}
      </div>
    );
  }

  // SIP calculation result
  if (result && typeof result === 'object' && result.estimated_maturity) {
    return (
      <div className="rounded-lg p-3 mb-2" style={{background:'white', border:'1px solid var(--kalpana-rose-100)'}}>
        <div className="font-semibold text-sm mb-2" style={{color:'var(--kalpana-rose-700)'}}>{meta.icon} SIP projection</div>
        <div className="grid grid-cols-2 gap-2 text-xs">
          <div><span style={{color:'var(--kalpana-text-soft)'}}>Monthly SIP:</span> <strong>{result.monthly_sip}</strong></div>
          <div><span style={{color:'var(--kalpana-text-soft)'}}>Duration:</span> <strong>{result.duration_years} years</strong></div>
          <div><span style={{color:'var(--kalpana-text-soft)'}}>Annual return:</span> <strong>{result.annual_return}</strong></div>
          <div><span style={{color:'var(--kalpana-text-soft)'}}>Total invested:</span> <strong>{result.total_invested}</strong></div>
          <div className="col-span-2 pt-2 mt-1 border-t" style={{borderColor:'var(--kalpana-rose-100)'}}>
            <span style={{color:'var(--kalpana-text-soft)'}}>Estimated maturity:</span> <strong style={{color:'var(--kalpana-rose-700)'}}>{result.estimated_maturity}</strong>
          </div>
          <div className="col-span-2 text-[11px] italic" style={{color:'var(--kalpana-text-soft)'}}>
            Wealth gained: {result.wealth_gained}. Past performance isn't a guarantee.
          </div>
        </div>
      </div>
    );
  }

  // Helplines dictionary
  if (result && typeof result === 'object' && (result.women_helpline || result.emergency)) {
    const lines = [
      ["Women's Helpline", result.women_helpline],
      ["Police", result.police],
      ["Emergency", result.emergency],
      ["Ambulance", result.ambulance],
      ["Child Helpline", result.child_helpline],
      ["Domestic Violence", result.domestic_violence],
      ["Cyber Crime", result.cyber_crime],
    ].filter(([_, v]) => !!v);
    return (
      <div className="rounded-lg p-3 mb-2" style={{background:'white', border:'1px solid var(--kalpana-rose-100)'}}>
        <div className="font-semibold text-sm mb-2" style={{color:'var(--kalpana-rose-700)'}}>{meta.icon} Helpline numbers</div>
        <div className="grid grid-cols-2 gap-x-3 gap-y-1 text-xs">
          {lines.map(([k, v]) => (
            <div key={k}><span style={{color:'var(--kalpana-text-soft)'}}>{k}:</span> <strong>{v}</strong></div>
          ))}
        </div>
      </div>
    );
  }

  // Job search results (search_jobs_web)
  if (result && typeof result === 'object' && result.success && result.results && tool === 'search_jobs_web') {
    return (
      <div className="rounded-lg p-3 mb-2" style={{background:'white', border:'1px solid var(--kalpana-rose-100)'}}>
        <div className="font-semibold text-sm mb-2" style={{color:'var(--kalpana-rose-700)'}}>{meta.icon} Job opportunities</div>
        <div className="space-y-2">
          {result.results.slice(0, 5).map((job, i) => (
            <div key={i} className="rounded-lg p-3 text-sm" style={{background:'var(--kalpana-rose-50)', border:'1px solid var(--kalpana-rose-100)'}}>
              <div className="font-medium" style={{color:'var(--kalpana-text)'}}>{job.title}</div>
              <div className="text-xs mt-0.5" style={{color:'var(--kalpana-text-soft)'}}>{job.company} · {job.location}</div>
              <div className="flex gap-3 mt-1 text-xs" style={{color:'var(--kalpana-text-soft)'}}>
                <span>{job.salary}</span>
                <span>{job.type}</span>
                <span>{job.posted}</span>
              </div>
            </div>
          ))}
        </div>
      </div>
    );
  }

  // Budget analysis results (analyze_budget)
  if (result && typeof result === 'object' && result.success && result.summary && tool === 'analyze_budget') {
    const summary = result.summary;
    const scoreColor = result.health_score >= 70 ? '#4a7a3f' : result.health_score >= 40 ? '#b8772b' : '#b03168';
    return (
      <div className="rounded-lg p-3 mb-2" style={{background:'white', border:'1px solid var(--kalpana-rose-100)'}}>
        <div className="font-semibold text-sm mb-2" style={{color:'var(--kalpana-rose-700)'}}>{meta.icon} Budget analysis</div>
        <div className="grid grid-cols-2 gap-2 text-xs mb-3">
          <div><span style={{color:'var(--kalpana-text-soft)'}}>Income:</span> <strong>₹{summary.monthly_income?.toLocaleString()}</strong></div>
          <div><span style={{color:'var(--kalpana-text-soft)'}}>Expenses:</span> <strong>₹{summary.total_expenses?.toLocaleString()}</strong></div>
          <div><span style={{color:'var(--kalpana-text-soft)'}}>Savings:</span> <strong>₹{summary.current_savings?.toLocaleString()}</strong></div>
          <div><span style={{color:'var(--kalpana-text-soft)'}}>Savings rate:</span> <strong>{summary.savings_rate}%</strong></div>
        </div>
        <div className="flex items-center gap-2 mb-2">
          <span className="text-xs" style={{color:'var(--kalpana-text-soft)'}}>Health score:</span>
          <div className="flex-1 rounded-full h-2" style={{background:'var(--kalpana-rose-50)'}}>
            <div className="h-full rounded-full" style={{width:`${result.health_score}%`, background:scoreColor}}></div>
          </div>
          <span className="text-xs font-bold" style={{color:scoreColor}}>{result.health_score}/100</span>
        </div>
        {result.recommendations && result.recommendations.length > 0 && (
          <div className="mt-2">
            <div className="text-xs font-medium mb-1" style={{color:'var(--kalpana-text-soft)'}}>Recommendations:</div>
            {result.recommendations.slice(0, 3).map((rec, i) => (
              <div key={i} className="text-xs mt-1" style={{color:'var(--kalpana-text)'}}>• {rec.message}</div>
            ))}
          </div>
        )}
      </div>
    );
  }

  // Health risk assessment (assess_health_risk)
  if (result && typeof result === 'object' && result.success && result.risk_level && tool === 'assess_health_risk') {
    const riskColors = { low: '#4a7a3f', moderate: '#b8772b', high: '#b03168' };
    return (
      <div className="rounded-lg p-3 mb-2" style={{background:'white', border:'1px solid var(--kalpana-rose-100)'}}>
        <div className="font-semibold text-sm mb-2" style={{color:'var(--kalpana-rose-700)'}}>{meta.icon} Health risk assessment</div>
        <div className="flex items-center gap-2 mb-2">
          <span className="text-xs" style={{color:'var(--kalpana-text-soft)'}}>Risk level:</span>
          <span className="px-2 py-0.5 rounded-full text-xs font-medium" style={{background:`${riskColors[result.risk_level]}20`, color:riskColors[result.risk_level]}}>
            {result.risk_level}
          </span>
        </div>
        {result.risk_factors && result.risk_factors.length > 0 && (
          <div className="mb-2">
            <div className="text-xs font-medium mb-1" style={{color:'var(--kalpana-text-soft)'}}>Risk factors:</div>
            {result.risk_factors.slice(0, 3).map((rf, i) => (
              <div key={i} className="text-xs mt-1" style={{color:'var(--kalpana-text)'}}>• {rf.factor} ({rf.impact})</div>
            ))}
          </div>
        )}
        {result.recommendations && result.recommendations.length > 0 && (
          <div>
            <div className="text-xs font-medium mb-1" style={{color:'var(--kalpana-text-soft)'}}>Recommendations:</div>
            {result.recommendations.slice(0, 3).map((rec, i) => (
              <div key={i} className="text-xs mt-1" style={{color:'var(--kalpana-text)'}}>• {rec}</div>
            ))}
          </div>
        )}
        <div className="text-[10px] mt-2 italic" style={{color:'var(--kalpana-text-soft)'}}>{result.disclaimer}</div>
      </div>
    );
  }

  // Mental wellbeing check (mental_wellbeing_check)
  if (result && typeof result === 'object' && result.success && result.wellbeing_level && tool === 'mental_wellbeing_check') {
    const wellbeingColors = { good: '#4a7a3f', fair: '#b8772b', concerning: '#b03168' };
    return (
      <div className="rounded-lg p-3 mb-2" style={{background:'white', border:'1px solid var(--kalpana-rose-100)'}}>
        <div className="font-semibold text-sm mb-2" style={{color:'var(--kalpana-rose-700)'}}>{meta.icon} Mental wellbeing check</div>
        <div className="flex items-center gap-2 mb-2">
          <span className="text-xs" style={{color:'var(--kalpana-text-soft)'}}>Wellbeing:</span>
          <span className="px-2 py-0.5 rounded-full text-xs font-medium" style={{background:`${wellbeingColors[result.wellbeing_level]}20`, color:wellbeingColors[result.wellbeing_level]}}>
            {result.wellbeing_level}
          </span>
        </div>
        {result.strategies && result.strategies.length > 0 && (
          <div>
            <div className="text-xs font-medium mb-1" style={{color:'var(--kalpana-text-soft)'}}>Coping strategies:</div>
            {result.strategies.slice(0, 4).map((str, i) => (
              <div key={i} className="text-xs mt-1" style={{color:'var(--kalpana-text)'}}>• {str}</div>
            ))}
          </div>
        )}
        {result.crisis_resources && result.crisis_resources.length > 0 && (
          <div className="mt-2 p-2 rounded" style={{background:'#fef9e7', border:'1px solid #f4c785'}}>
            <div className="text-xs font-medium mb-1" style={{color:'#b8772b'}}>Crisis support:</div>
            {result.crisis_resources.map((res, i) => (
              <div key={i} className="text-xs mt-1" style={{color:'var(--kalpana-text)'}}>
                <strong>{res.name}:</strong> {res.number} ({res.hours})
              </div>
            ))}
          </div>
        )}
        <div className="text-[10px] mt-2 italic" style={{color:'var(--kalpana-text-soft)'}}>{result.disclaimer}</div>
      </div>
    );
  }

  // Scheme eligibility (check_scheme_eligibility)
  if (result && typeof result === 'object' && result.success && result.schemes && tool === 'check_scheme_eligibility') {
    return (
      <div className="rounded-lg p-3 mb-2" style={{background:'white', border:'1px solid var(--kalpana-rose-100)'}}>
        <div className="font-semibold text-sm mb-2" style={{color:'var(--kalpana-rose-700)'}}>{meta.icon} Eligible schemes ({result.total_eligible})</div>
        <div className="space-y-2">
          {result.schemes.slice(0, 5).map((scheme, i) => (
            <div key={i} className="rounded-lg p-3 text-sm" style={{background:'var(--kalpana-rose-50)', border:'1px solid var(--kalpana-rose-100)'}}>
              <div className="font-medium" style={{color:'var(--kalpana-text)'}}>{scheme.name}</div>
              <div className="text-xs mt-0.5" style={{color:'var(--kalpana-text-soft)'}}>{scheme.type}</div>
              <div className="text-xs mt-1"><strong>Eligibility:</strong> {scheme.eligibility}</div>
              <div className="text-xs mt-1"><strong>Benefit:</strong> {scheme.benefit}</div>
              <div className="text-xs mt-1"><strong>How to apply:</strong> {scheme.how_to_apply}</div>
            </div>
          ))}
        </div>
      </div>
    );
  }

  // Tavily web search results
  if (result && typeof result === 'object' && result.success && result.results && result.source === 'tavily') {
    return (
      <div className="rounded-lg p-3 mb-2" style={{background:'white', border:'1px solid var(--kalpana-rose-100)'}}>
        <div className="font-semibold text-sm mb-2" style={{color:'var(--kalpana-rose-700)'}}>{meta.icon} Web search results</div>
        {result.answer && (
          <div className="rounded-lg p-3 mb-2 text-sm" style={{background:'var(--kalpana-rose-50)', border:'1px solid var(--kalpana-rose-100)'}}>
            <div className="font-medium mb-1" style={{color:'var(--kalpana-text)'}}>Quick answer:</div>
            <div style={{color:'var(--kalpana-text-soft)'}}>{result.answer}</div>
          </div>
        )}
        <div className="space-y-2">
          {result.results.slice(0, 5).map((r, i) => (
            <div key={i} className="rounded-lg p-3 text-sm" style={{background:'var(--kalpana-rose-50)', border:'1px solid var(--kalpana-rose-100)'}}>
              <a href={r.url} target="_blank" rel="noopener" className="font-medium hover:underline" style={{color:'var(--kalpana-rose-700)'}}>
                {r.title}
              </a>
              <div className="text-xs mt-1 line-clamp-2" style={{color:'var(--kalpana-text-soft)'}}>{r.snippet}</div>
            </div>
          ))}
        </div>
      </div>
    );
  }

  // Error
  if (result && typeof result === 'object' && result.error) {
    return (
      <div className="rounded-lg p-3 text-sm mb-2 flex items-center justify-between gap-3" style={{background:'white', border:'1px solid var(--kalpana-rose-100)', color:'var(--kalpana-text-soft)'}}>
        <span>I couldn't complete that just now.</span>
        {onRetry && (
          <button onClick={onRetry}
            className="text-xs px-3 py-1.5 rounded-lg font-medium transition hover:opacity-80 flex-shrink-0"
            style={{background:'var(--kalpana-rose-500)', color:'white'}}>
            Try again →
          </button>
        )}
      </div>
    );
  }

  // Generic object — last-resort friendly text, NEVER raw JSON
  return (
    <div className="rounded-lg p-3 text-sm mb-2" style={{background:'white', border:'1px solid var(--kalpana-rose-100)', color:'var(--kalpana-text-soft)'}}>
      Done. Let me know if you'd like more detail.
    </div>
  );
}

// ─── Crisis Support Card — warm, urgent, tappable helplines ───
function CrisisCard({ content, helplines }) {
  // The intro/closer come as plain text in `content`; we render helplines as tappable rows.
  const lines = (content || '').split('\n');
  const intro = lines.length ? lines[0] : '';
  const closer = lines.length > 1 ? lines[lines.length - 1] : '';
  return (
    <div className="rounded-2xl p-5 my-2 slide-up" style={{background:'#fff8f0', border:'2px solid #f0b37e'}}>
      <div className="flex items-center gap-2 mb-3">
        <span className="text-lg">🤍</span>
        <span className="text-sm font-medium font-heading" style={{color:'#b8772b'}}>You matter. Help is here.</span>
      </div>
      {intro && <p className="text-sm leading-relaxed mb-3" style={{color:'var(--kalpana-text)'}}>{intro}</p>}
      <div className="space-y-2 mb-3">
        {(helplines || []).map((h, i) => (
          <a key={i} href={`tel:${(h.number||'').replace(/[^0-9+]/g,'')}`}
            className="flex items-center justify-between gap-3 rounded-xl px-4 py-3 transition hover:-translate-y-0.5"
            style={{background:'white', border:'1px solid #f0b37e'}}>
            <div className="min-w-0">
              <div className="text-sm font-medium truncate" style={{color:'var(--kalpana-text)'}}>{h.name}</div>
              <div className="text-[11px]" style={{color:'var(--kalpana-text-soft)'}}>{h.hours}</div>
            </div>
            <span className="text-sm font-semibold flex-shrink-0" style={{color:'#b8772b'}}>📞 {h.number}</span>
          </a>
        ))}
      </div>
      {closer && <p className="text-xs leading-relaxed" style={{color:'var(--kalpana-text-soft)'}}>{closer}</p>}
    </div>
  );
}

// ─── Chat Message ───
function speakText(text, lang) {
  try {
    if (!window.speechSynthesis) return;
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance((text || '').slice(0, 600));
    u.lang = lang || 'en-IN';
    window.speechSynthesis.speak(u);
  } catch(e) {}
}

function ChatMessage({ msg, isLatest, onQuickReply, onPickNextStep, onFeedback, onUpload, onSkipUpload, speakLang }) {
  const isUser = msg.role === 'user';
  const pillar = PILLAR_STYLES[msg.pillar] || {};
  const isClarifying = !isUser && msg.type === 'clarifying_question';
  const isAnswer = !isUser && (!msg.type || msg.type === 'answer');
  const isToolResult = !isUser && msg.type === 'tool_result';
  const isCrisis = !isUser && msg.type === 'crisis';
  const isSystemNote = !isUser && msg.type === 'system_note';
  const isAttachmentAck = !isUser && msg.type === 'attachment_ack';

  // Crisis support renders as a standalone urgent card
  if (isCrisis) {
    return (
      <div className="flex justify-start slide-up">
        <div className="max-w-[92%]">
          <CrisisCard content={msg.content} helplines={msg.helplines}/>
        </div>
      </div>
    );
  }

  // Tool result renders as a standalone card (no bubble wrapper)
  if (isToolResult) {
    const retryFn = msg.retry_step && onPickNextStep ? () => onPickNextStep(msg.retry_step) : null;
    return (
      <div className="flex justify-start slide-up">
        <div className="max-w-[90%]">
          <ToolResultCard results={msg.tool_results} onRetry={retryFn}/>
        </div>
      </div>
    );
  }

  // System notes get a small italic line, no avatar
  if (isSystemNote) {
    return (
      <div className="flex justify-center slide-up">
        <div className="text-xs italic py-1" style={{color:'var(--kalpana-text-soft)'}}>{msg.content}</div>
      </div>
    );
  }

  // Attachment acknowledgement (user side)
  if (isAttachmentAck) {
    return (
      <div className="flex justify-end slide-up">
        <div className="kalpana-bubble-user flex items-center gap-2">
          <span>📎</span>
          <span className="text-sm">{msg.content || `Shared ${msg.filename || 'a document'}`}</span>
        </div>
      </div>
    );
  }

  // Detect a clarifying question that's asking for a document/report (Bug 2)
  const asksForDoc = isClarifying && msg.is_doc_request;

  return (
    <div className={`flex ${isUser ? 'justify-end' : 'justify-start'} slide-up`}>
      <div className={isUser ? 'kalpana-bubble-user' : 'kalpana-bubble-bot'}>
        {isAnswer && msg.pillar && (
          <div className={`kalpana-badge ${pillar.badge} mb-2`}>
            {pillar.icon} {pillar.label || msg.pillar}
          </div>
        )}
        <div className="text-sm leading-relaxed whitespace-pre-wrap" style={{wordBreak:'break-word'}}>
          {msg.content}
          {msg._streaming && (
            msg.content
              ? <span className="inline-block w-1.5 h-4 ml-0.5 align-middle" style={{background:'var(--kalpana-rose-400)', animation:'pulse 1s infinite'}}></span>
              : <span className="text-xs italic" style={{color:'var(--kalpana-text-soft)'}}>Kalpana is thinking…</span>
          )}
        </div>

        {/* DOC REQUEST clarifying question: show upload + skip, hide yes/no pills */}
        {asksForDoc && isLatest && onUpload && (
          <div className="flex gap-2 mt-3 flex-wrap items-center">
            <label className="kalpana-btn-secondary text-xs py-1.5 px-3 cursor-pointer inline-flex items-center gap-1.5">
              📎 Upload file
              <input type="file" className="hidden"
                accept="image/*,.pdf,.doc,.docx"
                onChange={(e) => {
                  const file = e.target.files?.[0];
                  if (file) onUpload(file);
                  e.target.value = '';
                }}/>
            </label>
            <button onClick={() => onSkipUpload && onSkipUpload()}
              className="text-xs py-1.5 px-3 rounded-xl transition"
              style={{color:'var(--kalpana-text-soft)', background:'transparent', border:'1px dashed var(--kalpana-rose-100)'}}>
              Skip — I'll share later
            </button>
          </div>
        )}

        {/* Quick reply pills for yes/no clarifying questions (when NOT a doc request) */}
        {isClarifying && !asksForDoc && isLatest && msg.is_yes_no && onQuickReply && (
          <div className="flex gap-2 mt-3 flex-wrap">
            <button onClick={() => onQuickReply('Yes')} className="kalpana-btn-secondary text-xs py-1.5 px-3">Yes</button>
            <button onClick={() => onQuickReply('No')} className="kalpana-btn-secondary text-xs py-1.5 px-3">No</button>
            <button onClick={() => onQuickReply('Skip')} className="text-xs py-1.5 px-3 rounded-xl transition" style={{color:'var(--kalpana-text-soft)', background:'transparent', border:'1px dashed var(--kalpana-rose-100)'}}>Skip</button>
          </div>
        )}
        {/* Skip button for open-ended clarifying questions */}
        {isClarifying && !asksForDoc && isLatest && !msg.is_yes_no && onQuickReply && (
          <div className="flex gap-2 mt-3">
            <button onClick={() => onQuickReply('Skip')} className="text-xs py-1.5 px-3 rounded-xl transition" style={{color:'var(--kalpana-text-soft)', background:'transparent', border:'1px dashed var(--kalpana-rose-100)'}}>Skip this</button>
          </div>
        )}

        {/* Answer-only affordances (hidden while still streaming) */}
        {isAnswer && !msg._streaming && (
          <>
            <CitationChips chips={msg.citation_chips} citations={msg.citations}/>
            <div className="flex items-center gap-3 mt-2">
              <button onClick={() => speakText(msg.content, speakLang)} title="Read aloud"
                className="text-xs flex items-center gap-1 transition hover:opacity-70"
                style={{color:'var(--kalpana-rose-700)'}}>🔊 Read aloud</button>
              <button onClick={() => window.speechSynthesis && window.speechSynthesis.cancel()} title="Stop"
                className="text-xs transition hover:opacity-70" style={{color:'var(--kalpana-text-soft)'}}>⏹ Stop</button>
            </div>
            <FeedbackBar onFeedback={(v) => onFeedback && onFeedback(msg, v)}/>
            <NextStepsCards steps={msg.next_steps} onPick={(s) => onPickNextStep && onPickNextStep(s)}/>
            {msg.tools_to_call?.length > 0 && msg.awaiting_approval && (
              <ApprovalCard tools={msg.tools_to_call} sessionId={msg.session_id} onApprove={msg.onApprove} onReject={msg.onReject}/>
            )}
            {msg.approval_resolved && (
              <div className="text-xs italic mt-3" style={{color:'var(--kalpana-text-soft)'}}>
                {msg.approval_resolved === 'approved' ? '✓ Going ahead with this' : '✕ Skipped'}
              </div>
            )}
            {msg.latency_ms && (
              <div className="text-[10px] mt-3" style={{color:'var(--kalpana-text-soft)'}}>
                {msg.latency_ms}ms {msg.from_cache ? '(cached)' : ''}
                {msg.usage && msg.usage.total_tokens > 0 && (
                  <> · {Number(msg.usage.total_tokens).toLocaleString()} tokens · ${Number(msg.usage.cost_usd||0).toFixed(5)}</>
                )}
              </div>
            )}
          </>
        )}
      </div>
    </div>
  );
}

// ═══════════════════════════════════════
// ONBOARDING VIEW — Conversational chat-style with branching
// ═══════════════════════════════════════
function OnboardingView({ idToken, onComplete }) {
  const [currentQuestion, setCurrentQuestion] = useState(null);
  const [textInput, setTextInput] = useState('');
  const [messages, setMessages] = useState([]);
  const [answeredCount, setAnsweredCount] = useState(0);
  const [totalSteps, setTotalSteps] = useState(6);
  const [transitioning, setTransitioning] = useState(false);
  const [loading, setLoading] = useState(true);
  const [completing, setCompleting] = useState(false);
  const endRef = useRef(null);
  const inputRef = useRef(null);

  const authHeaders = { 'Content-Type': 'application/json', 'Authorization': `Bearer ${idToken}` };

  useEffect(() => { endRef.current?.scrollIntoView({ behavior:'smooth' }); }, [messages]);

  useEffect(() => { fetchState(); }, []);

  // Helper — normalize option (string or {value,label})
  const optionValue = (o) => typeof o === 'string' ? o : o.value;
  const optionLabel = (o) => typeof o === 'string' ? o : o.label;

  const fetchState = async () => {
    try {
      const res = await fetch(`${API}/onboarding/state`, { headers: authHeaders });
      const data = await res.json();
      if (data.complete) {
        onComplete();
        return;
      }
      const q = data.current_question;
      if (q) {
        setCurrentQuestion(q);
        setAnsweredCount(data.answered_count || 0);
        setTotalSteps(data.total_steps || 6);
        setMessages([{ role:'assistant', content: q.kalpana_says, question: q }]);
      }
    } catch(e) {
      console.error('Failed to fetch onboarding state:', e);
    }
    setLoading(false);
  };

  const submitAnswer = async (value, label) => {
    if (!currentQuestion || transitioning) return;
    setTransitioning(true);

    // Add user message bubble (display the label, send the value)
    setMessages(prev => [...prev, { role:'user', content: label || value }]);

    try {
      const res = await fetch(`${API}/onboarding/answer`, {
        method: 'POST',
        headers: authHeaders,
        body: JSON.stringify({ question_id: currentQuestion.id, answer: value }),
      });
      const data = await res.json();

      if (data.complete) {
        setCompleting(true);
        setMessages(prev => [...prev, {
          role:'assistant',
          content: "Wonderful. Setting up your space\u2026"
        }]);
        setTimeout(() => onComplete(), 1800);
        return;
      }

      const nextQ = data.next_question;
      setAnsweredCount(c => c + 1);
      setTimeout(() => {
        setMessages(prev => [...prev, { role:'assistant', content: nextQ.kalpana_says, question: nextQ }]);
        setCurrentQuestion(nextQ);
        setTextInput('');
        setTransitioning(false);
        inputRef.current?.focus();
      }, 450);
    } catch(e) {
      console.error('Failed to save answer:', e);
      setTransitioning(false);
    }
  };

  if (loading) {
    return (
      <div className="flex items-center justify-center h-[calc(100vh-72px)]" style={{color:'var(--kalpana-text-soft)'}}>
        <div className="thinking-dot inline-block w-2 h-2 rounded-full mr-1" style={{background:'var(--kalpana-rose-500)'}}></div>
        <div className="thinking-dot inline-block w-2 h-2 rounded-full mr-1" style={{background:'var(--kalpana-rose-500)', animationDelay:'0.2s'}}></div>
        <div className="thinking-dot inline-block w-2 h-2 rounded-full mr-3" style={{background:'var(--kalpana-rose-500)', animationDelay:'0.4s'}}></div>
        Loading...
      </div>
    );
  }

  const progressPct = totalSteps > 0 ? (answeredCount / totalSteps) * 100 : 0;

  return (
    <div className="flex flex-col h-[calc(100vh-72px)]" style={{background:'var(--kalpana-bg)'}}>
      {/* Progress Bar */}
      <div className="px-4 py-3" style={{borderBottom:'1px solid var(--kalpana-rose-100)', background:'white'}}>
        <div className="max-w-2xl mx-auto">
          <div className="flex items-center justify-between mb-1.5">
            <span className="text-xs font-heading" style={{color:'var(--kalpana-rose-700)'}}>Getting to know you</span>
            <span className="text-xs" style={{color:'var(--kalpana-text-soft)'}}>Step {Math.min(answeredCount + 1, totalSteps)} of {totalSteps}</span>
          </div>
          <div className="w-full rounded-full h-1.5 overflow-hidden" style={{background:'var(--kalpana-rose-50)'}}>
            <div className="h-full rounded-full transition-all duration-500" style={{width:`${progressPct}%`, background:'linear-gradient(to right, var(--kalpana-rose-500), var(--kalpana-rose-700))'}}></div>
          </div>
        </div>
      </div>

      {/* Messages */}
      <div className="flex-1 overflow-y-auto px-4 py-6 space-y-4">
        <div className="max-w-2xl mx-auto space-y-4">
          {messages.map((msg, i) => {
            const isLatest = i === messages.length - 1;
            const isAssistant = msg.role === 'assistant';
            const q = msg.question;
            return (
              <div key={i} className={`flex ${isAssistant ? 'justify-start' : 'justify-end'} slide-up`}>
                {isAssistant ? (
                  <div className="flex gap-2 items-start max-w-[85%]">
                    <div className="flex-shrink-0 mt-1"><KalpanaLogo size={28}/></div>
                    <div className="kalpana-bubble-bot">
                      <div className="flex items-center gap-2 mb-2">
                        <span className="text-xs font-medium font-heading" style={{color:'var(--kalpana-rose-700)'}}>Kalpana</span>
                      </div>
                      <div className="text-sm leading-relaxed whitespace-pre-wrap">{msg.content}</div>
                      {/* Choice buttons for latest assistant message */}
                      {isLatest && q?.type === 'choice' && !completing && (
                        <div className="grid grid-cols-2 gap-2 mt-4">
                          {q.options.map((opt, j) => (
                            <button key={j}
                              onClick={() => submitAnswer(optionValue(opt), optionLabel(opt))}
                              disabled={transitioning}
                              className="text-left text-sm font-medium rounded-xl px-4 py-3 transition-all disabled:opacity-50 disabled:cursor-not-allowed hover:-translate-y-0.5"
                              style={{background:'white', border:'1.5px solid var(--kalpana-rose-100)', color:'var(--kalpana-text)', boxShadow:'0 1px 3px rgba(233, 78, 138, 0.05)'}}>
                              {optionLabel(opt)}
                            </button>
                          ))}
                        </div>
                      )}
                    </div>
                  </div>
                ) : (
                  <div className="kalpana-bubble-user text-sm leading-relaxed">{msg.content}</div>
                )}
              </div>
            );
          })}
          {transitioning && !completing && (
            <KalpanaThinking label="Kalpana is listening"/>
          )}
          {completing && (
            <div className="flex justify-center py-4 fade-in">
              <div className="flex items-center gap-2 font-heading" style={{color:'var(--kalpana-rose-700)'}}>
                <div className="thinking-dot inline-block w-2 h-2 rounded-full" style={{background:'var(--kalpana-rose-500)'}}></div>
                <div className="thinking-dot inline-block w-2 h-2 rounded-full" style={{background:'var(--kalpana-rose-500)', animationDelay:'0.2s'}}></div>
                <div className="thinking-dot inline-block w-2 h-2 rounded-full" style={{background:'var(--kalpana-rose-500)', animationDelay:'0.4s'}}></div>
                <span className="text-sm ml-1 italic">Setting up your space…</span>
              </div>
            </div>
          )}
          <div ref={endRef}/>
        </div>
      </div>

      {/* Input (for text-type questions) */}
      {currentQuestion?.type === 'text' && !completing && (
        <div className="p-4" style={{borderTop:'1px solid var(--kalpana-rose-100)', background:'white'}}>
          <div className="flex gap-3 max-w-2xl mx-auto">
            <input ref={inputRef} value={textInput} onChange={e => setTextInput(e.target.value)}
              onKeyDown={e => e.key==='Enter' && textInput.trim() && submitAnswer(textInput.trim(), textInput.trim())}
              placeholder={currentQuestion.placeholder || "Type your answer..."}
              className="flex-1 rounded-xl px-4 py-3 text-sm focus:outline-none transition"
              style={{background:'var(--kalpana-rose-50)', border:'1px solid var(--kalpana-rose-100)', color:'var(--kalpana-text)'}}/>
            <button onClick={() => textInput.trim() && submitAnswer(textInput.trim(), textInput.trim())} disabled={!textInput.trim() || transitioning}
              className="kalpana-btn-primary text-sm disabled:opacity-30 disabled:cursor-not-allowed">
              Send
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

// ═══════════════════════════════════════
// GREETING CARD
// ═══════════════════════════════════════
function GreetingCard({ greeting, onContinue, onStartFresh }) {
  if (!greeting) return null;
  return (
    <div className="fade-in">
      <div className="max-w-2xl mx-auto mb-4">
        <div className="kalpana-card p-6" style={{background:'linear-gradient(135deg, var(--kalpana-rose-50) 0%, #fef3e2 100%)'}}>
          <div className="flex items-start gap-3 mb-3">
            <KalpanaLogo size={28}/>
            <div>
              <p className="text-xs font-medium mb-1 font-heading" style={{color:'var(--kalpana-rose-700)'}}>Kalpana remembers</p>
              <p className="leading-relaxed" style={{color:'var(--kalpana-text)'}}>{greeting.greeting}</p>
            </div>
          </div>
          {greeting.has_context && (
            <div className="flex gap-3 mt-4 ml-10 flex-wrap">
              <button onClick={onContinue} className="kalpana-btn-primary text-sm">
                Continue where we left off
              </button>
              <button onClick={onStartFresh} className="kalpana-btn-secondary text-sm">
