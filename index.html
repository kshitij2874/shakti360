  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            heading: ['Playfair Display', 'Georgia', 'serif'],
          },
          colors: {
            kalpana: {
              50:'#fff5f7', 100:'#ffe0e9', 200:'#fbcfe8', 300:'#f9a8c3',
              400:'#f472b6', 500:'#e94e8a', 600:'#db2777', 700:'#b03168',
              800:'#8B1538', 900:'#831843',
            },
            rose: { 50:'#fff5f7', 100:'#ffe0e9', 300:'#f9a8c3', 500:'#e94e8a', 700:'#b03168' },
            health: { light:'#ffe0e9', DEFAULT:'#e94e8a', dark:'#b03168' },
            finance: { light:'#fef3e2', DEFAULT:'#f4c785', dark:'#b8772b' },
            career: { light:'#e8f0e6', DEFAULT:'#a7c4a0', dark:'#4a7a3f' },
          }
        }
      }
    }
  </script>
  <style>
    :root {
      --kalpana-rose-50: #fff5f7;
      --kalpana-rose-100: #ffe0e9;
      --kalpana-rose-300: #f9a8c3;
      --kalpana-rose-500: #e94e8a;
      --kalpana-rose-700: #b03168;
      --kalpana-burgundy: #8B1538;
      --kalpana-lavender: #c4b5fd;
      --kalpana-sage: #a7c4a0;
      --kalpana-amber: #f4c785;
      --kalpana-bg: #fffafb;
      --kalpana-text: #2d1f24;
      --kalpana-text-soft: #6b5560;
      --kalpana-card-shadow: 0 4px 20px rgba(233, 78, 138, 0.08);
    }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--kalpana-bg);
      color: var(--kalpana-text);
    }

    h1, h2, h3, .font-heading {
      font-family: 'Playfair Display', Georgia, serif;
    }

    .kalpana-card {
      background: white;
      border-radius: 20px;
      box-shadow: var(--kalpana-card-shadow);

    .kalpana-btn-primary {
      background: var(--kalpana-rose-500);
      color: white;
      padding: 10px 20px;
      border-radius: 12px;
      font-weight: 500;
      transition: all 0.2s;
    }

    .kalpana-btn-primary:hover {
      background: var(--kalpana-rose-700);
      transform: translateY(-1px);
    }

    .kalpana-btn-secondary {
      background: white;
      color: var(--kalpana-rose-700);
      border: 1.5px solid var(--kalpana-rose-300);
      padding: 10px 20px;
      border-radius: 12px;
      font-weight: 500;
      transition: all 0.2s;
    }

    .kalpana-btn-secondary:hover {
      background: var(--kalpana-rose-50);
    }

    .kalpana-bubble-user {
      background: var(--kalpana-rose-100);
      color: var(--kalpana-text);
      border-radius: 20px 20px 4px 20px;
      padding: 14px 18px;

    }

    .kalpana-bubble-bot {
      background: white;
      border: 1px solid var(--kalpana-rose-100);
      border-radius: 20px 20px 20px 4px;
      padding: 14px 18px;

    .kalpana-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 10px;

    }

      display: inline-block;
      padding: 3px 10px;
      background: var(--kalpana-rose-50);
      color: var(--kalpana-rose-700);

      font-style: italic;
      animation: kalpana-pulse 1.5s ease-in-out infinite;
    }

    @keyframes kalpana-pulse {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }

    @keyframes pulse-dot { 0%,100%{opacity:1} 50%{opacity:0.3} }
    .thinking-dot { animation: pulse-dot 1.2s ease-in-out infinite; }
    @keyframes fade-in { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }

    ::-webkit-scrollbar { width:6px }
    ::-webkit-scrollbar-track { background:transparent }

<body class="font-sans min-h-screen">
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;
const API = window.location.origin;

// ─── Kalpana Lotus Logo ───
function KalpanaLogo({ size = 40 }) {
  return (
    <svg width={size} height={size} viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="kg" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stopColor="#f9a8c3" />
          <stop offset="100%" stopColor="#e94e8a" />
        </linearGradient>
      </defs>
      <path d="M50 85 Q30 75 25 50 Q35 55 50 65 Q65 55 75 50 Q70 75 50 85 Z" fill="url(#kg)" />
      <path d="M50 75 Q35 60 35 35 Q42 40 50 55 Q58 40 65 35 Q65 60 50 75 Z" fill="url(#kg)" opacity="0.85" />
      <ellipse cx="50" cy="40" rx="6" ry="20" fill="url(#kg)" opacity="0.9" />
      <circle cx="50" cy="22" r="3" fill="#b03168" />
    </svg>
  );
}

// ─── Pillar Config (Kalpana palette) ───
const PILLAR_STYLES = {
  HEALTH:  { badge:'kalpana-badge-health',  icon:'🌸', label:'Health' },
  FINANCE: { badge:'kalpana-badge-finance', icon:'💰', label:'Finance' },
  CAREER:  { badge:'kalpana-badge-career',  icon:'🌿', label:'Career' },
};

// ─── Thinking Indicator ───
function ThinkingIndicator({ steps }) {
  const current = steps[steps.length - 1];
  if (!current) return null;
  return (
    <div className="flex items-center gap-2 px-4 py-2 text-sm fade-in">
      <span className="thinking-dot inline-block w-2 h-2 rounded-full" style={{background:'var(--kalpana-rose-500)'}}></span>
      <span className="thinking-dot inline-block w-2 h-2 rounded-full" style={{background:'var(--kalpana-rose-500)', animationDelay:'0.2s'}}></span>
      <span className="thinking-dot inline-block w-2 h-2 rounded-full" style={{background:'var(--kalpana-rose-500)', animationDelay:'0.4s'}}></span>
      <span className="ml-1 kalpana-thinking">{current.detail}</span>
    </div>
  );
}

// ─── Citation Chips ───
function CitationChips({ chips, citations }) {
  // Prefer structured chips ({label, source, section}); fall back to legacy strings
  let items = [];
  if (Array.isArray(chips) && chips.length > 0) {
    items = chips.map(c => ({
      label: (c.label || '').toString().substring(0, 30),
      title: c.source || c.section || '',
    }));
  } else if (Array.isArray(citations) && citations.length > 0) {
    items = citations.map(c => {
      const label = (c || '').replace(/\[Source:\s*/i, '').replace(/\]$/, '').split(',')[0].trim().substring(0, 30);
      return { label, title: c };
    });
  }
  if (items.length === 0) return null;
  return (
    <div className="flex flex-wrap gap-1.5 mt-3">
      {items.map((it, i) => (
        <span key={i} className="kalpana-source-chip" title={it.title}>{it.label}</span>
      ))}
    </div>
  );
}

// ─── Next-Step Suggestion Cards ───
function NextStepsCards({ steps, onPick }) {
  if (!Array.isArray(steps) || steps.length === 0) return null;
  return (
    <div className="mt-4 space-y-2">
      {steps.map((s, i) => (
        <button key={i} onClick={() => onPick && onPick(s)}
          className="w-full text-left rounded-xl px-4 py-3 text-sm transition-all hover:-translate-y-0.5 flex items-center justify-between gap-3"
          style={{background:'white', border:'1.5px solid var(--kalpana-rose-100)', color:'var(--kalpana-text)', boxShadow:'0 1px 3px rgba(233, 78, 138, 0.05)'}}>
          <span className="flex-1">{s.label}</span>
          <span style={{color:'var(--kalpana-rose-500)'}}>→</span>
        </button>
      ))}
    </div>
  );
}

// ─── Feedback Bar ───
function FeedbackBar({ onFeedback }) {
  const [chosen, setChosen] = useState(null);
  if (chosen) {
    return (
      <div className="mt-3 text-xs italic" style={{color:'var(--kalpana-text-soft)'}}>
        Thanks for the feedback.
      </div>
    );
  }
  const pick = (v) => { setChosen(v); if (onFeedback) onFeedback(v); };
  return (
    <div className="flex items-center gap-3 mt-3 text-xs" style={{color:'var(--kalpana-text-soft)'}}>
      <span>Was this helpful?</span>
      <button onClick={() => pick('up')} className="hover:scale-110 transition" title="Helpful">👍</button>
      <button onClick={() => pick('down')} className="hover:scale-110 transition" title="Not helpful">👎</button>
    </div>
  );
}

// ─── Approval Card ───
function ApprovalCard({ tools, sessionId, onApprove, onReject }) {
  return (
    <div className="rounded-xl p-4 my-3 fade-in" style={{background:'#fef9e7', border:'1px solid #f4c785'}}>
      <div className="flex items-center gap-2 mb-3">
        <span className="text-lg">⚠️</span>
        <h4 className="font-semibold text-sm" style={{color:'#b8772b'}}>Action Approval Required</h4>
      </div>
      <div className="space-y-2 mb-4">
        {tools.map((t, i) => (
          <div key={i} className="rounded-lg p-3 text-xs" style={{background:'white', border:'1px solid var(--kalpana-rose-100)'}}>
            <div className="font-mono" style={{color:'#b8772b'}}>{t.tool}({JSON.stringify(t.params)})</div>
            <div className="mt-1" style={{color:'var(--kalpana-text-soft)'}}>{t.reason}</div>
          </div>
        ))}
      </div>
      <div className="flex gap-3">
        <button onClick={() => onApprove(sessionId)} className="kalpana-btn-primary flex-1 text-sm">✓ Approve</button>
        <button onClick={() => onReject(sessionId)} className="kalpana-btn-secondary flex-1 text-sm">✕ Reject</button>
      </div>
    </div>
  );
}

// ─── Chat Message ───
function ChatMessage({ msg, isLatest, onQuickReply, onPickNextStep, onFeedback }) {
  const isUser = msg.role === 'user';
  const pillar = PILLAR_STYLES[msg.pillar] || {};
  const isClarifying = !isUser && msg.type === 'clarifying_question';
  const isAnswer = !isUser && (!msg.type || msg.type === 'answer');

  return (
    <div className={`flex ${isUser ? 'justify-end' : 'justify-start'} fade-in`}>
      <div className={isUser ? 'kalpana-bubble-user' : 'kalpana-bubble-bot'}>
        {!isUser && isClarifying && (
          <div className="kalpana-badge kalpana-badge-health mb-2" style={{background:'rgba(196, 181, 253, 0.18)', color:'#6d4ed4'}}>
            🌸 Getting to know your situation
            {typeof msg.question_index === 'number' && typeof msg.questions_total === 'number' && (
              <span className="ml-1 opacity-70">· {msg.question_index + 1}/{msg.questions_total}</span>
            )}
          </div>
        )}
        {isAnswer && msg.pillar && (
          <div className={`kalpana-badge ${pillar.badge} mb-2`}>
            {pillar.icon} {pillar.label || msg.pillar}
          </div>
        )}
        {/* Full answer text — whitespace-pre-wrap, never truncated */}
        <div className="text-sm leading-relaxed whitespace-pre-wrap" style={{wordBreak:'break-word'}}>
          {msg.content}
        </div>

        {/* Quick reply pills for yes/no clarifying questions, only on the latest */}
        {isClarifying && isLatest && msg.is_yes_no && onQuickReply && (
          <div className="flex gap-2 mt-3 flex-wrap">
            <button onClick={() => onQuickReply('Yes')} className="kalpana-btn-secondary text-xs py-1.5 px-3">Yes</button>
            <button onClick={() => onQuickReply('No')} className="kalpana-btn-secondary text-xs py-1.5 px-3">No</button>
            <button onClick={() => onQuickReply('Skip')} className="text-xs py-1.5 px-3 rounded-xl transition" style={{color:'var(--kalpana-text-soft)', background:'transparent', border:'1px dashed var(--kalpana-rose-100)'}}>Skip</button>
          </div>
        )}
        {/* Skip button for open-ended clarifying questions */}
        {isClarifying && isLatest && !msg.is_yes_no && onQuickReply && (
          <div className="flex gap-2 mt-3">
            <button onClick={() => onQuickReply('Skip')} className="text-xs py-1.5 px-3 rounded-xl transition" style={{color:'var(--kalpana-text-soft)', background:'transparent', border:'1px dashed var(--kalpana-rose-100)'}}>Skip this</button>
          </div>
        )}

        {/* Answer-only affordances */}
        {isAnswer && (
          <>
            <CitationChips chips={msg.citation_chips} citations={msg.citations}/>
            <FeedbackBar onFeedback={(v) => onFeedback && onFeedback(msg, v)}/>
            <NextStepsCards steps={msg.next_steps} onPick={(s) => onPickNextStep && onPickNextStep(s)}/>
            {msg.tools_to_call?.length > 0 && msg.awaiting_approval && (
              <ApprovalCard tools={msg.tools_to_call} sessionId={msg.session_id} onApprove={msg.onApprove} onReject={msg.onReject}/>
            )}
            {msg.latency_ms && (
              <div className="text-[10px] mt-3" style={{color:'var(--kalpana-text-soft)'}}>{msg.latency_ms}ms {msg.from_cache ? '(cached)' : ''}</div>
            )}
          </>
        )}
      </div>
    </div>
  );
}

// ═══════════════════════════════════════
// ONBOARDING VIEW — Conversational chat-style with branching
// ═══════════════════════════════════════
function OnboardingView({ idToken, onComplete }) {
  const [currentQuestion, setCurrentQuestion] = useState(null);
  const [textInput, setTextInput] = useState('');
  const [messages, setMessages] = useState([]);
  const [answeredCount, setAnsweredCount] = useState(0);
  const [totalSteps, setTotalSteps] = useState(6);
  const [transitioning, setTransitioning] = useState(false);
  const [loading, setLoading] = useState(true);
  const [completing, setCompleting] = useState(false);
  const endRef = useRef(null);
  const inputRef = useRef(null);

  const authHeaders = { 'Content-Type': 'application/json', 'Authorization': `Bearer ${idToken}` };

  useEffect(() => { endRef.current?.scrollIntoView({ behavior:'smooth' }); }, [messages]);

  useEffect(() => { fetchState(); }, []);

  // Helper — normalize option (string or {value,label})
  const optionValue = (o) => typeof o === 'string' ? o : o.value;
  const optionLabel = (o) => typeof o === 'string' ? o : o.label;

  const fetchState = async () => {
    try {
      const res = await fetch(`${API}/onboarding/state`, { headers: authHeaders });
      const data = await res.json();
      if (data.complete) {
        onComplete();
        return;
      }
      const q = data.current_question;
      if (q) {
        setCurrentQuestion(q);
        setAnsweredCount(data.answered_count || 0);
        setTotalSteps(data.total_steps || 6);
        setMessages([{ role:'assistant', content: q.kalpana_says, question: q }]);
      }
    } catch(e) {
      console.error('Failed to fetch onboarding state:', e);
    }
    setLoading(false);
  };

  const submitAnswer = async (value, label) => {
    if (!currentQuestion || transitioning) return;
    setTransitioning(true);

    // Add user message bubble (display the label, send the value)
    setMessages(prev => [...prev, { role:'user', content: label || value }]);

    try {
      const res = await fetch(`${API}/onboarding/answer`, {
        method: 'POST',
        headers: authHeaders,
        body: JSON.stringify({ question_id: currentQuestion.id, answer: value }),
      });
      const data = await res.json();

      if (data.complete) {
        setCompleting(true);
        setMessages(prev => [...prev, {
          role:'assistant',
          content: "Wonderful. Setting up your space\u2026"
        }]);
        setTimeout(() => onComplete(), 1800);
        return;
      }

      const nextQ = data.next_question;
      setAnsweredCount(c => c + 1);
      setTimeout(() => {
        setMessages(prev => [...prev, { role:'assistant', content: nextQ.kalpana_says, question: nextQ }]);
        setCurrentQuestion(nextQ);
        setTextInput('');
        setTransitioning(false);
        inputRef.current?.focus();
      }, 450);
    } catch(e) {
      console.error('Failed to save answer:', e);
      setTransitioning(false);
    }
  };

  if (loading) {
    return (
      <div className="flex items-center justify-center h-[calc(100vh-72px)]" style={{color:'var(--kalpana-text-soft)'}}>
        <div className="thinking-dot inline-block w-2 h-2 rounded-full mr-1" style={{background:'var(--kalpana-rose-500)'}}></div>
        <div className="thinking-dot inline-block w-2 h-2 rounded-full mr-1" style={{background:'var(--kalpana-rose-500)', animationDelay:'0.2s'}}></div>
        <div className="thinking-dot inline-block w-2 h-2 rounded-full mr-3" style={{background:'var(--kalpana-rose-500)', animationDelay:'0.4s'}}></div>
        Loading...
      </div>
    );
  }

  const progressPct = totalSteps > 0 ? (answeredCount / totalSteps) * 100 : 0;

  return (
    <div className="flex flex-col h-[calc(100vh-72px)]" style={{background:'var(--kalpana-bg)'}}>
      {/* Progress Bar */}
      <div className="px-4 py-3" style={{borderBottom:'1px solid var(--kalpana-rose-100)', background:'white'}}>
        <div className="max-w-2xl mx-auto">
          <div className="flex items-center justify-between mb-1.5">
            <span className="text-xs font-heading" style={{color:'var(--kalpana-rose-700)'}}>Getting to know you</span>
            <span className="text-xs" style={{color:'var(--kalpana-text-soft)'}}>Step {Math.min(answeredCount + 1, totalSteps)} of {totalSteps}</span>
          </div>
          <div className="w-full rounded-full h-1.5 overflow-hidden" style={{background:'var(--kalpana-rose-50)'}}>
            <div className="h-full rounded-full transition-all duration-500" style={{width:`${progressPct}%`, background:'linear-gradient(to right, var(--kalpana-rose-500), var(--kalpana-rose-700))'}}></div>
          </div>
        </div>
      </div>

      {/* Messages */}
      <div className="flex-1 overflow-y-auto px-4 py-6 space-y-4">
        <div className="max-w-2xl mx-auto space-y-4">
          {messages.map((msg, i) => {
            const isLatest = i === messages.length - 1;
            const isAssistant = msg.role === 'assistant';
            const q = msg.question;
            return (
              <div key={i} className={`flex ${isAssistant ? 'justify-start' : 'justify-end'} fade-in`}>
                {isAssistant ? (
                  <div className="flex gap-2 items-start max-w-[85%]">
                    <div className="flex-shrink-0 mt-1"><KalpanaLogo size={28}/></div>
                    <div className="kalpana-bubble-bot">
                      <div className="flex items-center gap-2 mb-2">
                        <span className="text-xs font-medium font-heading" style={{color:'var(--kalpana-rose-700)'}}>Kalpana</span>
                      </div>
                      <div className="text-sm leading-relaxed whitespace-pre-wrap">{msg.content}</div>
                      {/* Choice buttons for latest assistant message */}
                      {isLatest && q?.type === 'choice' && !completing && (
                        <div className="grid grid-cols-2 gap-2 mt-4">
                          {q.options.map((opt, j) => (
                            <button key={j}
                              onClick={() => submitAnswer(optionValue(opt), optionLabel(opt))}
                              disabled={transitioning}
                              className="text-left text-sm font-medium rounded-xl px-4 py-3 transition-all disabled:opacity-50 disabled:cursor-not-allowed hover:-translate-y-0.5"
                              style={{background:'white', border:'1.5px solid var(--kalpana-rose-100)', color:'var(--kalpana-text)', boxShadow:'0 1px 3px rgba(233, 78, 138, 0.05)'}}>
                              {optionLabel(opt)}
                            </button>
                          ))}
                        </div>
                      )}
                    </div>
                  </div>
                ) : (
                  <div className="kalpana-bubble-user text-sm leading-relaxed">{msg.content}</div>
                )}
              </div>
            );
          })}
          {transitioning && !completing && (
            <div className="flex gap-2 items-start fade-in">
              <div className="flex-shrink-0 mt-1"><KalpanaLogo size={28}/></div>
              <div className="kalpana-bubble-bot">
                <div className="thinking-dot inline-block w-2 h-2 rounded-full mr-1" style={{background:'var(--kalpana-rose-500)'}}></div>
                <div className="thinking-dot inline-block w-2 h-2 rounded-full mr-1" style={{background:'var(--kalpana-rose-500)', animationDelay:'0.2s'}}></div>
                <div className="thinking-dot inline-block w-2 h-2 rounded-full" style={{background:'var(--kalpana-rose-500)', animationDelay:'0.4s'}}></div>
              </div>
            </div>
          )}
          {completing && (
            <div className="flex justify-center py-4 fade-in">
              <div className="flex items-center gap-2 font-heading" style={{color:'var(--kalpana-rose-700)'}}>
                <div className="thinking-dot inline-block w-2 h-2 rounded-full" style={{background:'var(--kalpana-rose-500)'}}></div>
                <div className="thinking-dot inline-block w-2 h-2 rounded-full" style={{background:'var(--kalpana-rose-500)', animationDelay:'0.2s'}}></div>
                <div className="thinking-dot inline-block w-2 h-2 rounded-full" style={{background:'var(--kalpana-rose-500)', animationDelay:'0.4s'}}></div>
                <span className="text-sm ml-1 italic">Setting up your space…</span>
              </div>
            </div>
          )}
          <div ref={endRef}/>
        </div>
      </div>

      {/* Input (for text-type questions) */}
      {currentQuestion?.type === 'text' && !completing && (
        <div className="p-4" style={{borderTop:'1px solid var(--kalpana-rose-100)', background:'white'}}>
          <div className="flex gap-3 max-w-2xl mx-auto">
            <input ref={inputRef} value={textInput} onChange={e => setTextInput(e.target.value)}
              onKeyDown={e => e.key==='Enter' && textInput.trim() && submitAnswer(textInput.trim(), textInput.trim())}
              placeholder={currentQuestion.placeholder || "Type your answer..."}
              className="flex-1 rounded-xl px-4 py-3 text-sm focus:outline-none transition"
              style={{background:'var(--kalpana-rose-50)', border:'1px solid var(--kalpana-rose-100)', color:'var(--kalpana-text)'}}/>
            <button onClick={() => textInput.trim() && submitAnswer(textInput.trim(), textInput.trim())} disabled={!textInput.trim() || transitioning}
              className="kalpana-btn-primary text-sm disabled:opacity-30 disabled:cursor-not-allowed">
              Send
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

// ═══════════════════════════════════════
// CHAT VIEW
// ═══════════════════════════════════════
function ChatView({ idToken, user, onResetOnboarding }) {
  const [messages, setMessages] = useState([]);
  const [input, setInput] = useState('');
  const [ageBand, setAgeBand] = useState(null); // Will be set from profile
  const [preferredName, setPreferredName] = useState(''); // From onboarding
  const [userMode, setUserMode] = useState('self');
  const [subjectRole, setSubjectRole] = useState('');
  const [profileLoaded, setProfileLoaded] = useState(false);
  const [greeting, setGreeting] = useState(null);
  const [showGreeting, setShowGreeting] = useState(false);
  const userId = user.uid;
  const [sessionId, setSessionId] = useState(() => crypto.randomUUID().substring(0,12));
  const [loading, setLoading] = useState(false);
  const [thinkingSteps, setThinkingSteps] = useState([]);
  const endRef = useRef(null);
  const inputRef = useRef(null);

  const authHeaders = { 'Content-Type': 'application/json', 'Authorization': `Bearer ${idToken}` };

  // Friendly labels for subject_role keys
  const SUBJECT_ROLE_LABELS = {
    wife:'wife', daughter:'daughter', mother:'mother', sister:'sister', friend:'friend', colleague:'colleague',
    student:'student', working:'working woman', new_mother:'new mother', homemaker:'homemaker', entrepreneur:'entrepreneur', retired:'mid-life',
  };
  const subjectLabel = SUBJECT_ROLE_LABELS[subjectRole] || subjectRole;

  useEffect(() => { endRef.current?.scrollIntoView({ behavior:'smooth' }); }, [messages, thinkingSteps]);

  // Fetch user profile + greeting on mount
  useEffect(() => {
    const init = async () => {
      try {
        const res = await fetch(`${API}/onboarding/state`, { headers: authHeaders });
        const data = await res.json();
        if (data.complete && data.profile) {
          if (data.profile.age_band) setAgeBand(data.profile.age_band);
          if (data.profile.preferred_name) setPreferredName(data.profile.preferred_name);
          if (data.profile.user_mode) setUserMode(data.profile.user_mode);
          if (data.profile.subject_role) setSubjectRole(data.profile.subject_role);
        }
        if (!data.profile?.age_band) setAgeBand('25-40');
      } catch(e) {
        console.error('Failed to fetch profile:', e);
        setAgeBand('25-40');
      }
      setProfileLoaded(true);

      // Fetch greeting
      try {
        const gRes = await fetch(`${API}/greeting`, { headers: authHeaders });
        const gData = await gRes.json();
        if (gData.greeting) {
          setGreeting(gData);
          setShowGreeting(true);
        }
      } catch(e) {
        console.error('Failed to fetch greeting:', e);
      }
    };
    init();
  }, []);

  // Greeting handlers
  const handleContinue = () => {
    if (greeting?.last_query) {
      setInput(`Let's continue our conversation about ${greeting.last_pillar || 'that topic'}.`);
    }
    setShowGreeting(false);
    inputRef.current?.focus();
  };

  const handleStartFresh = () => {
    setShowGreeting(false);
    inputRef.current?.focus();
  };

  const handlePickNextStep = (step) => {
    // Send the suggestion's label as the user's next message — this starts
    // a fresh clarifying flow for the new topic.
    if (!step || !step.label) return;
    submitValue(step.label);
  };

  const handleFeedback = (msg, value) => {
    // Lightweight feedback — log to console for now (Langfuse pickup happens server-side)
    console.log('Feedback:', value, 'for session', msg?.session_id);
    try {
      fetch(`${API}/feedback`, {
        method:'POST',
        headers: authHeaders,
        body: JSON.stringify({ session_id: msg?.session_id, value }),
      }).catch(() => {}); // best-effort, endpoint may not exist
    } catch (e) {
      // ignore
    }
  };

  const handleSwitchMode = async () => {
    const ok = window.confirm(
      "Switch who Kalpana is helping?\n\nThis will restart the short setup conversation so we can re-tune for you."
    );
    if (!ok) return;
    try {
      await fetch(`${API}/onboarding/reset`, { method:'POST', headers:authHeaders });
      if (onResetOnboarding) onResetOnboarding();
    } catch(e) {
      console.error('Failed to reset onboarding:', e);
    }
  };

  const handleApprove = async (sid) => {
    try {
      const res = await fetch(`${API}/approve`, { method:'POST', headers:authHeaders, body:JSON.stringify({session_id:sid}) });
      const data = await res.json();
      setMessages(prev => [...prev, { role:'assistant', content:'✅ Tools executed successfully:\n\n' + JSON.stringify(data.tool_results, null, 2), pillar:'' }]);
    } catch(e) { console.error(e); }
  };

  const handleReject = async (sid) => {
    try {
      await fetch(`${API}/reject`, { method:'POST', headers:authHeaders, body:JSON.stringify({session_id:sid}) });
      setMessages(prev => [...prev, { role:'assistant', content:'❌ Tool execution was rejected. How else can I help?', pillar:'' }]);
    } catch(e) { console.error(e); }
  };

  // Track whether we're mid-clarifying-flow (controls UI hints)
  const clarifyingActive = messages.length > 0 &&
    messages[messages.length - 1]?.role === 'assistant' &&
    messages[messages.length - 1]?.type === 'clarifying_question';

  const submitValue = async (rawValue) => {
    const q = (rawValue || '').toString().trim();
    if (!q || loading || !ageBand) return;
    setInput('');
    setShowGreeting(false);
    setMessages(prev => [...prev, { role:'user', content:q }]);
    setLoading(true);
    setThinkingSteps([{ step:'classifying', detail:'Thinking...' }]);

    try {
      const res = await fetch(`${API}/chat`, {
        method:'POST', headers:authHeaders,
        body:JSON.stringify({ user_id:userId, age_band:ageBand, query:q, session_id:sessionId }),
      });
      const data = await res.json();
      setThinkingSteps(data.steps || []);
      setTimeout(() => {
        setMessages(prev => [...prev, {
          role:'assistant',
          type: data.type || 'answer',
          content: data.response,
          pillar: data.pillar,
          citations: data.citations,
          citation_chips: data.citation_chips,
          next_steps: data.next_steps,
          tools_to_call: data.tools_to_call,
          awaiting_approval: data.awaiting_approval,
          session_id: data.session_id,
          latency_ms: data.latency_ms,
          from_cache: data.from_cache,
          // clarifying-question fields
          is_yes_no: data.is_yes_no,
          question_index: data.question_index,
          questions_total: data.questions_total,
          onApprove: handleApprove,
          onReject: handleReject,
        }]);
        setThinkingSteps([]);
      }, 400);
    } catch(e) {
      setMessages(prev => [...prev, { role:'assistant', content:'Sorry, something went wrong. Please try again.' }]);
      setThinkingSteps([]);
    }
    setLoading(false);
  };

  const sendMessage = async () => submitValue(input);

  if (!profileLoaded) {
    return (
      <div className="flex items-center justify-center h-[calc(100vh-72px)]" style={{color:'var(--kalpana-text-soft)'}}>
        <div className="thinking-dot inline-block w-2 h-2 rounded-full mr-1" style={{background:'var(--kalpana-rose-500)'}}></div>
        <div className="thinking-dot inline-block w-2 h-2 rounded-full mr-1" style={{background:'var(--kalpana-rose-500)', animationDelay:'0.2s'}}></div>
        <div className="thinking-dot inline-block w-2 h-2 rounded-full mr-3" style={{background:'var(--kalpana-rose-500)', animationDelay:'0.4s'}}></div>
        Loading your profile...
      </div>
    );
  }

  const AGE_BANDS = ['11-24','25-40','41+'];

  return (
    <div className="flex flex-col h-[calc(100vh-72px)]" style={{background:'var(--kalpana-bg)'}}>
      {/* Subject Indicator (only in 'other' mode) */}
      {userMode === 'other' && preferredName && (
        <div className="px-4 py-2 text-sm flex items-center justify-center gap-2 flex-wrap"
          style={{background:'var(--kalpana-rose-50)', borderBottom:'1px solid var(--kalpana-rose-100)', color:'var(--kalpana-rose-700)'}}>
          <span>💕 Asking on behalf of <strong>{preferredName}</strong>{subjectLabel ? ` (${subjectLabel})` : ''}</span>
          <button onClick={handleSwitchMode} className="text-xs underline ml-1 hover:no-underline" style={{color:'var(--kalpana-rose-700)'}}>
            Switch
          </button>
        </div>
      )}

      {/* Age Band Selector */}
      <div className="flex items-center justify-center gap-2 py-3" style={{borderBottom:'1px solid var(--kalpana-rose-100)', background:'white'}}>
        <span className="text-xs mr-2" style={{color:'var(--kalpana-text-soft)'}}>
          {userMode === 'other' ? `Her age:` : 'Age Group:'}
        </span>
        {AGE_BANDS.map(ab => (
          <button key={ab} onClick={() => setAgeBand(ab)}
            className="px-4 py-1.5 rounded-full text-xs font-semibold transition-all"
            style={ageBand===ab
              ? {background:'var(--kalpana-rose-500)', color:'white', transform:'scale(1.05)', boxShadow:'0 4px 12px rgba(233, 78, 138, 0.25)'}
              : {background:'var(--kalpana-rose-50)', color:'var(--kalpana-rose-700)', border:'1px solid var(--kalpana-rose-100)'}}>
            {ab}
          </button>
        ))}
      </div>

      {/* Messages */}
      <div className="flex-1 overflow-y-auto px-4 py-4 space-y-4">
        {messages.length === 0 && !showGreeting && (
          <div className="flex flex-col items-center justify-center h-full text-center">
            <KalpanaLogo size={72}/>
            <h2 className="font-heading text-3xl mt-4" style={{color:'var(--kalpana-rose-700)'}}>
              Hi{preferredName ? `, ${preferredName}` : (user?.displayName ? `, ${user.displayName.split(' ')[0]}` : '')}. I'm Kalpana.
            </h2>
            <p className="mt-2 max-w-md text-sm" style={{color:'var(--kalpana-text-soft)'}}>
              Tell me what's on your mind today. I'm here to guide you across Health, Finance, and Career.
            </p>
            <div className="flex gap-3 mt-6">
              {Object.entries(PILLAR_STYLES).map(([k,v]) => (
                <span key={k} className={`kalpana-badge ${v.badge}`}>{v.icon} {v.label}</span>
              ))}
            </div>
          </div>
        )}
        {showGreeting && greeting && (
          <GreetingCard greeting={greeting} onContinue={handleContinue} onStartFresh={handleStartFresh}/>
        )}
        {messages.map((m, i) => (
          <ChatMessage
            key={i}
            msg={m}
            isLatest={i === messages.length - 1}
            onQuickReply={submitValue}
            onPickNextStep={handlePickNextStep}
            onFeedback={handleFeedback}
          />
        ))}
        {thinkingSteps.length > 0 && <ThinkingIndicator steps={thinkingSteps}/>}
        <div ref={endRef}/>
      </div>

      {/* Trust Footer */}
      <div className="text-center text-xs py-2" style={{color:'var(--kalpana-text-soft)', borderTop:'1px solid var(--kalpana-rose-50)'}}>
        🔒 Verified information only · Your data is private and secure
      </div>

      {/* Input */}
      <div className="p-4" style={{background:'white', borderTop:'1px solid var(--kalpana-rose-100)'}}>
        <div className="flex gap-3 max-w-3xl mx-auto">
          <input ref={inputRef} value={input} onChange={e => setInput(e.target.value)}
            onKeyDown={e => e.key==='Enter' && sendMessage()}
            placeholder={clarifyingActive ? "Type your answer..." : "Tell me what's on your mind today..."}
            className="flex-1 rounded-xl px-4 py-3 text-sm focus:outline-none transition"
            style={{background:'var(--kalpana-rose-50)', border:'1px solid var(--kalpana-rose-100)', color:'var(--kalpana-text)'}}/>
          <button onClick={sendMessage} disabled={loading || !input.trim()}
            className="kalpana-btn-primary text-sm disabled:opacity-30 disabled:cursor-not-allowed">
            {loading ? '...' : 'Send'}
          </button>
        </div>
      </div>
    </div>
  );
}

// ═══════════════════════════════════════
// DASHBOARD VIEW
// ═══════════════════════════════════════
function DashboardView() {
  const [data, setData] = useState(null);
  const pillarChartRef = useRef(null);
  const ageChartRef = useRef(null);
  const latencyChartRef = useRef(null);
  const chartsRef = useRef({});

  const fetchMetrics = useCallback(async () => {
    try {
      const res = await fetch(`${API}/metrics`);
      setData(await res.json());
    } catch(e) { console.error(e); }
  }, []);

  useEffect(() => { fetchMetrics(); const iv = setInterval(fetchMetrics, 5000); return () => clearInterval(iv); }, [fetchMetrics]);

  useEffect(() => {
    if (!data) return;
    // Pillar Pie
    if (pillarChartRef.current) {
      if (chartsRef.current.pillar) chartsRef.current.pillar.destroy();
      chartsRef.current.pillar = new Chart(pillarChartRef.current, {
        type:'doughnut', data:{
          labels:['Health','Finance','Career'],
          datasets:[{ data:[data.pillar_split.HEALTH||0, data.pillar_split.FINANCE||0, data.pillar_split.CAREER||0],
            backgroundColor:['#e94e8a','#f4c785','#a7c4a0'], borderWidth:0 }]
        }, options:{ plugins:{legend:{labels:{color:'#6b5560',font:{size:11}}}}, cutout:'65%' }
      });
    }
    // Age Pie
    if (ageChartRef.current) {
      if (chartsRef.current.age) chartsRef.current.age.destroy();
      chartsRef.current.age = new Chart(ageChartRef.current, {
        type:'doughnut', data:{
          labels:['11-24','25-40','41+'],
          datasets:[{ data:[data.age_band_split['11-24']||0, data.age_band_split['25-40']||0, data.age_band_split['41+']||0],
            backgroundColor:['#f9a8c3','#e94e8a','#b03168'], borderWidth:0 }]
        }, options:{ plugins:{legend:{labels:{color:'#6b5560',font:{size:11}}}}, cutout:'65%' }
      });
    }
    // Latency Line
    if (latencyChartRef.current) {
      if (chartsRef.current.latency) chartsRef.current.latency.destroy();
      const hist = data.latency_history || [];
      chartsRef.current.latency = new Chart(latencyChartRef.current, {
        type:'line', data:{
          labels:hist.map((_,i) => i+1),
          datasets:[{ label:'Latency (ms)', data:hist.map(h=>h.ms), borderColor:'#e94e8a', backgroundColor:'rgba(233,78,138,0.1)', fill:true, tension:0.4, pointRadius:2 }]
        }, options:{ scales:{ x:{ticks:{color:'#6b5560'},grid:{color:'rgba(233,78,138,0.05)'}}, y:{ticks:{color:'#6b5560'},grid:{color:'rgba(233,78,138,0.05)'}} }, plugins:{legend:{labels:{color:'#6b5560'}}} }
      });
    }
  }, [data]);

  if (!data) return <div className="flex items-center justify-center h-[calc(100vh-72px)]" style={{color:'var(--kalpana-text-soft)'}}>Loading metrics...</div>;

  const cards = [
    { label:'Total Sessions', value:data.total_sessions, icon:'📊', color:'var(--kalpana-rose-700)' },
    { label:'Avg Latency', value:`${data.avg_latency_ms}ms`, icon:'⚡', color:'#b8772b' },
    { label:'Avg Cost/Session', value:`$${data.avg_cost_per_session}`, icon:'💵', color:'#4a7a3f' },
    { label:'Hallucination Rate', value:`${(data.hallucination_rate*100).toFixed(1)}%`, icon:'🛡️', color:'var(--kalpana-rose-500)' },
  ];

  return (
    <div className="p-6 max-w-6xl mx-auto space-y-6 overflow-y-auto h-[calc(100vh-72px)]">
      <h2 className="font-heading text-2xl" style={{color:'var(--kalpana-rose-700)'}}>Dashboard</h2>
      {/* Stat Cards */}
      <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
        {cards.map((c,i) => (
          <div key={i} className="kalpana-card p-4 transition hover:-translate-y-0.5">
            <div className="text-2xl mb-1">{c.icon}</div>
            <div className="text-2xl font-bold font-heading" style={{color:c.color}}>{c.value}</div>
            <div className="text-xs mt-1" style={{color:'var(--kalpana-text-soft)'}}>{c.label}</div>
          </div>
        ))}
      </div>
      {/* Approval Gauge */}
      <div className="kalpana-card p-4">
        <div className="text-sm mb-2" style={{color:'var(--kalpana-text-soft)'}}>Approval Rate</div>
        <div className="w-full rounded-full h-4 overflow-hidden" style={{background:'var(--kalpana-rose-50)'}}>
          <div className="h-full rounded-full transition-all duration-700" style={{width:`${(data.approval_rate*100)}%`, background:'linear-gradient(to right, var(--kalpana-rose-500), var(--kalpana-rose-700))'}}></div>
        </div>
        <div className="text-right text-xs mt-1" style={{color:'var(--kalpana-text-soft)'}}>{(data.approval_rate*100).toFixed(0)}%</div>
      </div>
      {/* Charts */}
      <div className="grid md:grid-cols-3 gap-4">
        <div className="kalpana-card p-4"><div className="text-sm mb-3 font-heading" style={{color:'var(--kalpana-rose-700)'}}>Pillar Distribution</div><canvas ref={pillarChartRef}></canvas></div>
        <div className="kalpana-card p-4"><div className="text-sm mb-3 font-heading" style={{color:'var(--kalpana-rose-700)'}}>Age Band Distribution</div><canvas ref={ageChartRef}></canvas></div>
        <div className="kalpana-card p-4"><div className="text-sm mb-3 font-heading" style={{color:'var(--kalpana-rose-700)'}}>Latency Over Time</div><canvas ref={latencyChartRef}></canvas></div>
      </div>
    </div>
  );
}

// TRACE VIEWER
// ═══════════════════════════════════════
function TraceView() {
  const [sessions, setSessions] = useState([]);
  const [expanded, setExpanded] = useState(null);
  const [userId, setUserId] = useState('');

  const fetchSessions = async (uid) => {
    if (!uid) return;
    try {
      const res = await fetch(`${API}/sessions/${uid}`);
      const data = await res.json();
      setSessions(data.sessions || []);
    } catch(e) { console.error(e); }
  };

  return (
    <div className="p-6 max-w-5xl mx-auto overflow-y-auto h-[calc(100vh-72px)]">
      <h2 className="font-heading text-2xl mb-4" style={{color:'var(--kalpana-rose-700)'}}>Trace Viewer</h2>
      <div className="flex gap-3 mb-6">
        <input value={userId} onChange={e=>setUserId(e.target.value)} placeholder="Enter user_id..."
          className="flex-1 rounded-lg px-3 py-2 text-sm focus:outline-none transition"
          style={{background:'white', border:'1px solid var(--kalpana-rose-100)', color:'var(--kalpana-text)'}}/>
        <button onClick={()=>fetchSessions(userId)} className="kalpana-btn-primary text-sm">Load</button>
      </div>
      {sessions.length === 0 ? (
        <div className="text-center py-12" style={{color:'var(--kalpana-text-soft)'}}>No sessions found. Enter a user ID and click Load.</div>
      ) : (
        <div className="space-y-2">
          {sessions.slice(-10).reverse().map((s,i) => {
            const ps = PILLAR_STYLES[s.pillar] || {};
            return (
              <div key={i} className="kalpana-card overflow-hidden">
                <button onClick={()=>setExpanded(expanded===i?null:i)} className="w-full px-4 py-3 flex items-center gap-4 text-left transition hover:bg-rose-50">
                  <span className="text-xs font-mono w-16" style={{color:'var(--kalpana-text-soft)'}}>{new Date(s.timestamp*1000).toLocaleTimeString()}</span>
                  <span className={`kalpana-badge ${ps.badge || ''}`}>{s.pillar||'—'}</span>
                  <span className="text-xs" style={{color:'var(--kalpana-text-soft)'}}>{s.age_band}</span>
                  <span className="text-xs flex-1 truncate" style={{color:'var(--kalpana-text-soft)'}}>{s.response_preview}</span>
                  <span className="text-xs" style={{color:'#b8772b'}}>{s.latency_ms?.toFixed(0)}ms</span>
                  <span className="text-xs" style={{color:'var(--kalpana-text-soft)'}}>{s.citations_count||0} cites</span>
                  <span className="text-xs" style={{color:s.approved===true?'#4a7a3f':s.approved===false?'#b03168':'var(--kalpana-text-soft)'}}>{s.approved===true?'✓':s.approved===false?'✕':'—'}</span>
                </button>
                {expanded===i && (
                  <div className="px-4 pb-4 text-xs space-y-2 pt-3 fade-in" style={{borderTop:'1px solid var(--kalpana-rose-100)'}}>
                    <div><span style={{color:'var(--kalpana-text-soft)'}}>Session:</span> <span className="font-mono">{s.session_id}</span></div>
                    <div><span style={{color:'var(--kalpana-text-soft)'}}>Query:</span> <span>{s.query || '—'}</span></div>
                    <div><span style={{color:'var(--kalpana-text-soft)'}}>Response:</span> <span>{s.response_preview}</span></div>
                    {s.trace_url && <a href={s.trace_url} target="_blank" rel="noopener" className="inline-block mt-1 hover:underline" style={{color:'var(--kalpana-rose-500)'}}>View in Langfuse →</a>}
                  </div>
                )}
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

// ═══════════════════════════════════════
// AUTH HOOK
// ═══════════════════════════════════════
function useAuth() {
  const [user, setUser] = useState(null);
  const [idToken, setIdToken] = useState(() => localStorage.getItem('shakti_token'));
  const [authReady, setAuthReady] = useState(false);

  useEffect(() => {
    const initAuth = () => {
      if (!window.__shakti_auth) {
        setTimeout(initAuth, 100);
        return;
      }
      const { auth, onAuthStateChanged } = window.__shakti_auth;
      onAuthStateChanged(auth, async (firebaseUser) => {
        if (firebaseUser) {
          setUser(firebaseUser);
          const token = await firebaseUser.getIdToken();
          setIdToken(token);
          localStorage.setItem('shakti_token', token);
        } else {
          setUser(null);
          setIdToken(null);
          localStorage.removeItem('shakti_token');
        }
        setAuthReady(true);
      });
    };
    initAuth();
  }, []);

  const signIn = async () => {
    if (!window.__shakti_auth) return;
    const { auth, provider, signInWithPopup } = window.__shakti_auth;
    try {
      await signInWithPopup(auth, provider);
    } catch (e) {
      console.error('Sign-in failed:', e);
    }
  };

  const signOutUser = async () => {
    if (!window.__shakti_auth) return;
    const { auth, signOut } = window.__shakti_auth;
    try {
      await signOut(auth);
    } catch (e) {
      console.error('Sign-out failed:', e);
    }
  };

  return { user, idToken, authReady, signIn, signOut: signOutUser };
}

        <p className="text-sm mb-1 italic" style={{color:'var(--kalpana-text-soft)'}}>Guiding Dreams, Empowering Decisions</p>
        <p className="text-sm mb-6 mt-3" style={{color:'var(--kalpana-text-soft)'}}>Sign in with Google to start your journey with your AI life companion.</p>
        <button onClick={onSignIn}
          className="w-full flex items-center justify-center gap-3 px-6 py-3 rounded-xl font-semibold text-sm transition-all hover:scale-[1.02]"
          style={{background:'white', color:'var(--kalpana-text)', border:'1.5px solid var(--kalpana-rose-300)', boxShadow:'0 2px 8px rgba(233, 78, 138, 0.1)'}}>
          <svg className="w-5 h-5" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
          Sign in with Google
        </button>
        <p className="text-[11px] mt-4" style={{color:'var(--kalpana-text-soft)'}}>🔒 Your data is private and secure.</p>
      </div>
    </div>
  );
}

// ═══════════════════════════════════════
// APP ROOT
// ═══════════════════════════════════════
function App() {
  const [tab, setTab] = useState('chat');
  const { user, idToken, authReady, signIn, signOut } = useAuth();
  const [onboardingComplete, setOnboardingComplete] = useState(null); // null = not checked yet
  const [checkingOnboarding, setCheckingOnboarding] = useState(false);
  const tabs = [
    { id:'chat', label:'Chat', icon:'💬' },
    { id:'dashboard', label:'Dashboard', icon:'📊' },
    { id:'traces', label:'Traces', icon:'🔍' },
  ];

  // Check onboarding state when user signs in
  useEffect(() => {
    if (user && idToken) {
      checkOnboarding();
    } else {
      setOnboardingComplete(null);
    }
  }, [user, idToken]);

  const checkOnboarding = async () => {
    setCheckingOnboarding(true);
    try {
      const res = await fetch(`${API}/onboarding/state`, {
        headers: { 'Authorization': `Bearer ${idToken}` }
      });
      const data = await res.json();
      setOnboardingComplete(data.complete);
    } catch(e) {
      console.error('Failed to check onboarding:', e);
      setOnboardingComplete(true); // Default to complete on error
    }
    setCheckingOnboarding(false);
  };

  const handleOnboardingComplete = () => {
    setOnboardingComplete(true);
  };

  const handleResetOnboarding = () => {
    setOnboardingComplete(false);
  };

  const renderChatContent = () => {
    if (!authReady) {
      return (
        <div className="flex items-center justify-center h-[calc(100vh-72px)]" style={{color:'var(--kalpana-text-soft)'}}>
          <div className="thinking-dot inline-block w-2 h-2 rounded-full mr-1" style={{background:'var(--kalpana-rose-500)'}}></div>
          <div className="thinking-dot inline-block w-2 h-2 rounded-full mr-1" style={{background:'var(--kalpana-rose-500)', animationDelay:'0.2s'}}></div>
          <div className="thinking-dot inline-block w-2 h-2 rounded-full mr-3" style={{background:'var(--kalpana-rose-500)', animationDelay:'0.4s'}}></div>
          Loading...
        </div>
      );
    }

    if (!user) {
      return <SignInPrompt onSignIn={signIn}/>;
    }

    if (checkingOnboarding || onboardingComplete === null) {
      return (
        <div className="flex items-center justify-center h-[calc(100vh-72px)]" style={{color:'var(--kalpana-text-soft)'}}>
          <div className="thinking-dot inline-block w-2 h-2 rounded-full mr-1" style={{background:'var(--kalpana-rose-500)'}}></div>
          <div className="thinking-dot inline-block w-2 h-2 rounded-full mr-1" style={{background:'var(--kalpana-rose-500)', animationDelay:'0.2s'}}></div>
          <div className="thinking-dot inline-block w-2 h-2 rounded-full mr-3" style={{background:'var(--kalpana-rose-500)', animationDelay:'0.4s'}}></div>
          Loading...
        </div>
      );
    }

    if (!onboardingComplete) {
      return <OnboardingView idToken={idToken} onComplete={handleOnboardingComplete}/>;
    }

    return <ChatView idToken={idToken} user={user} onResetOnboarding={handleResetOnboarding}/>;
  };

  return (
    <div className="min-h-screen" style={{background:'var(--kalpana-bg)'}}>
      {/* Header */}
      <header className="sticky top-0 z-50" style={{background:'white', borderBottom:'1px solid var(--kalpana-rose-100)', boxShadow:'0 2px 8px rgba(233, 78, 138, 0.04)'}}>
        <div className="max-w-6xl mx-auto flex items-center justify-between px-4 h-[72px]">
          <div className="flex items-center gap-3">
            <KalpanaLogo size={36}/>
            <div>
              <h1 className="font-heading text-2xl leading-tight" style={{color:'var(--kalpana-rose-700)'}}>Kalpana</h1>
              <p className="text-[10px] tracking-wider italic" style={{color:'var(--kalpana-text-soft)'}}>Guiding Dreams, Empowering Decisions</p>
            </div>
          </div>
          <div className="flex items-center gap-3">
            <nav className="flex gap-1">
              {tabs.map(t => (
                <button key={t.id} id={`nav-${t.id}`} onClick={()=>setTab(t.id)}
                  className="px-4 py-2 rounded-lg text-sm font-medium transition-all"
                  style={tab===t.id
                    ? {background:'var(--kalpana-rose-50)', color:'var(--kalpana-rose-700)', border:'1px solid var(--kalpana-rose-100)'}
                    : {color:'var(--kalpana-text-soft)', background:'transparent'}}>
                  {t.icon} {t.label}
                </button>
              ))}
            </nav>
            {/* Auth Button */}
            {authReady && (
              user ? (
                <div className="flex items-center gap-2 ml-2 pl-3" style={{borderLeft:'1px solid var(--kalpana-rose-100)'}}>
                  <img src={user.photoURL} alt="" className="w-7 h-7 rounded-full" style={{border:'1px solid var(--kalpana-rose-300)'}}/>
                  <button onClick={signOut} className="text-xs transition px-2 py-1 rounded hover:bg-rose-50"
                    style={{color:'var(--kalpana-text-soft)'}} title="Sign out">
                    Sign out
                  </button>
                </div>
              ) : (
                <button onClick={signIn}
                  className="ml-2 px-4 py-2 rounded-lg text-xs font-medium transition-all flex items-center gap-2"
                  style={{background:'white', color:'var(--kalpana-text)', border:'1.5px solid var(--kalpana-rose-300)'}}>
                  <svg className="w-4 h-4" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
                  Sign in
                </button>
              )
            )}
          </div>
        </div>
      </header>

      {/* Views */}
      {tab === 'chat' && renderChatContent()}
      {tab === 'dashboard' && <DashboardView/>}
      {tab === 'traces' && <TraceView/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
