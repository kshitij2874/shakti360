}

// ═══════════════════════════════════════
// CHAT VIEW
// ═══════════════════════════════════════
function ChatView({ idToken, user, onResetOnboarding }) {
  const userId = user.uid;

  // ── Persistence keys (per user) so tab switches don't wipe the conversation ──
  const MSG_KEY = `kalpana_msgs_${userId}`;
  const SID_KEY = `kalpana_sid_${userId}`;

  const loadStoredMessages = () => {
    try {
      const raw = localStorage.getItem(MSG_KEY);
      if (!raw) return [];
      const parsed = JSON.parse(raw);
      return Array.isArray(parsed) ? parsed : [];
    } catch (e) { return []; }
  };
  const loadStoredSessionId = () => {
    try {
      const sid = localStorage.getItem(SID_KEY);
      return sid || crypto.randomUUID().substring(0, 12);
    } catch (e) { return crypto.randomUUID().substring(0, 12); }
  };

  const [messages, setMessages] = useState(loadStoredMessages);
  const [input, setInput] = useState('');
  const [ageBand, setAgeBand] = useState(null);
  const [preferredName, setPreferredName] = useState('');
  const [userMode, setUserMode] = useState('self');
  const [subjectRole, setSubjectRole] = useState('');
  const [language, setLanguage] = useState('English');
  const [listening, setListening] = useState(false);
  const recognitionRef = useRef(null);
  const [profileLoaded, setProfileLoaded] = useState(false);
  const [greeting, setGreeting] = useState(null);
  const [showGreeting, setShowGreeting] = useState(false);
  const [sessionId, setSessionId] = useState(loadStoredSessionId);
  const [loading, setLoading] = useState(false);
  const [thinkingSteps, setThinkingSteps] = useState([]);
  const endRef = useRef(null);
  const inputRef = useRef(null);

  const authHeaders = { 'Content-Type': 'application/json', 'Authorization': `Bearer ${idToken}` };

  // Persist messages + sessionId across tab switches / page reloads.
  // Strip non-serialisable callbacks before storing.
  useEffect(() => {
    try {
      const safe = messages.map(m => {
        const { onApprove, onReject, ...rest } = m || {};
        return rest;
      });
      localStorage.setItem(MSG_KEY, JSON.stringify(safe.slice(-30))); // cap at 30 turns
    } catch (e) { /* quota or serialisation error - ignore */ }
  }, [messages]);

  useEffect(() => {
    try { localStorage.setItem(SID_KEY, sessionId); } catch (e) {}
  }, [sessionId]);

  // Friendly labels for subject_role keys
  const SUBJECT_ROLE_LABELS = {
    wife:'wife', daughter:'daughter', mother:'mother', sister:'sister', friend:'friend', colleague:'colleague',
    student:'student', working:'working woman', new_mother:'new mother', homemaker:'homemaker', entrepreneur:'entrepreneur', retired:'mid-life',
  };
  const subjectLabel = SUBJECT_ROLE_LABELS[subjectRole] || subjectRole;

  useEffect(() => { endRef.current?.scrollIntoView({ behavior:'smooth' }); }, [messages, thinkingSteps]);

  // Fetch user profile + greeting on mount
  useEffect(() => {
    const init = async () => {
      try {
        const res = await fetch(`${API}/onboarding/state`, { headers: authHeaders });
        const data = await res.json();
        if (data.complete && data.profile) {
          if (data.profile.age_band) setAgeBand(data.profile.age_band);
          if (data.profile.preferred_name) setPreferredName(data.profile.preferred_name);
          if (data.profile.user_mode) setUserMode(data.profile.user_mode);
          if (data.profile.subject_role) setSubjectRole(data.profile.subject_role);
          if (data.profile.language) setLanguage(data.profile.language);
        }
        if (!data.profile?.age_band) setAgeBand('25-40');
      } catch(e) {
        console.error('Failed to fetch profile:', e);
        setAgeBand('25-40');
      }
      setProfileLoaded(true);

      // Fetch greeting
      try {
        const gRes = await fetch(`${API}/greeting`, { headers: authHeaders });
        const gData = await gRes.json();
        if (gData.greeting) {
          setGreeting(gData);
          setShowGreeting(true);
        }
      } catch(e) {
        console.error('Failed to fetch greeting:', e);
      }
    };
    init();
  }, []);

  // Greeting handlers
  const handleContinue = () => {
    // Prefer the specific life-context phrase if Kalpana extracted one
    if (greeting?.life_context) {
      setInput(`Let's pick up on what we were talking about — ${greeting.life_context}`);
    } else if (greeting?.last_query) {
      setInput(`Let's continue our conversation about ${greeting.last_pillar || 'that topic'}.`);
    }
    setShowGreeting(false);
    inputRef.current?.focus();
  };

  const handleStartFresh = () => {
    setShowGreeting(false);
    inputRef.current?.focus();
  };

  const handlePickNextStep = async (step) => {
    if (!step || !step.label) return;

    // Show the user's tap as a message
    setMessages(prev => [...prev, { role:'user', content: step.label }]);
    setShowGreeting(false);
    setLoading(true);

    // ── TOOL_CALL action: execute the tool directly, render clean result ──
    if (step.action_type === 'tool_call' && step.tool_or_context) {
      setThinkingSteps([{ step:'tool', detail:`Running ${step.tool_or_context.replace(/_/g,' ')}...` }]);
      try {
        const res = await fetch(`${API}/tool/execute`, {
          method:'POST',
          headers: authHeaders,
          body: JSON.stringify({ tool: step.tool_or_context, params: {} }),
        });
        const data = await res.json();
        setMessages(prev => [...prev, {
          role: 'assistant',
          type: 'tool_result',
          content: '',
          tool_results: [{ tool: step.tool_or_context, result: data }],
          retry_step: step,
        }]);
      } catch (e) {
        console.error('Tool execution failed:', e);
        setMessages(prev => [...prev, {
          role: 'assistant',
          type: 'tool_result',
          content: '',
          tool_results: [{ tool: step.tool_or_context, result: { error: e.message || 'Request failed' } }],
          retry_step: step,
        }]);
      }
      setThinkingSteps([]);
      setLoading(false);
      return;
    }

    // ── AGENT_CONTINUE action: send as a follow-up (orchestrator detects followup) ──
    // Just call /chat — the follow-up detector will skip re-clarifying.
    setThinkingSteps([{ step:'thinking', detail:'Kalpana is thinking...' }]);
    try {
      const res = await fetch(`${API}/chat`, {
        method:'POST',
        headers: authHeaders,
        body: JSON.stringify({
          user_id: userId,
          age_band: ageBand,
          query: step.label,
          session_id: sessionId,
        }),
      });
      const data = await res.json();
      setTimeout(() => {
        setMessages(prev => [...prev, {
          role:'assistant',
          type: data.type || 'answer',
          content: data.response,
          pillar: data.pillar,
          citations: data.citations,
          citation_chips: data.citation_chips,
          next_steps: data.next_steps,
          tools_to_call: data.tools_to_call,
          awaiting_approval: data.awaiting_approval,
          session_id: data.session_id,
          latency_ms: data.latency_ms,
          from_cache: data.from_cache,
          is_yes_no: data.is_yes_no,
          is_doc_request: data.is_doc_request,
          question_index: data.question_index,
          questions_total: data.questions_total,
          onApprove: handleApprove,
          onReject: handleReject,
        }]);
        setThinkingSteps([]);
        setLoading(false);
      }, 400);
    } catch (e) {
      console.error('Follow-up failed:', e);
      setMessages(prev => [...prev, {
        role:'assistant', type:'system_note',
        content:"Something went wrong. Want to rephrase?"
      }]);
      setThinkingSteps([]);
      setLoading(false);
    }
  };

  const handleFeedback = (msg, value) => {
    // Lightweight feedback — log to console for now (Langfuse pickup happens server-side)
    console.log('Feedback:', value, 'for session', msg?.session_id);
    try {
      fetch(`${API}/feedback`, {
        method:'POST',
        headers: authHeaders,
        body: JSON.stringify({ session_id: msg?.session_id, value }),
      }).catch(() => {}); // best-effort, endpoint may not exist
    } catch (e) {
      // ignore
    }
  };

  const handleNewConversation = async () => {
    if (messages.length === 0) return;
    const ok = window.confirm("Start a new conversation? Your current chat will be cleared.");
    if (!ok) return;
    
    // Clear backend session state first
    const oldSid = sessionId;
    const fresh = crypto.randomUUID().substring(0, 12);
    
    try {
      await fetch(`${API}/session/reset`, {
        method: 'POST',
        headers: authHeaders,
        body: JSON.stringify({ session_id: oldSid }),
      });
    } catch (e) {
      // Best-effort — frontend reset is what matters most
      console.warn('Backend session reset failed:', e);
    }
    
    // Clear frontend state
    setMessages([]);
    setShowGreeting(false);
    setInput('');
    setThinkingSteps([]);
    setSessionId(fresh);
    
    try {
      localStorage.removeItem(MSG_KEY);
      localStorage.setItem(SID_KEY, fresh);
    } catch (e) {}
    
    // Refetch greeting for the new session
    try {
      const gRes = await fetch(`${API}/greeting`, { headers: authHeaders });
      const gData = await gRes.json();
      if (gData.greeting) {
        setGreeting(gData);
        setShowGreeting(true);
      }
    } catch (e) {
      console.warn('Greeting refetch failed:', e);
    }
    
    inputRef.current?.focus();
  };

  const handleSwitchMode = async () => {
    const ok = window.confirm(
      "Switch who Kalpana is helping?\n\nThis will restart the short setup conversation so we can re-tune for you."
    );
    if (!ok) return;
    try {
      await fetch(`${API}/onboarding/reset`, { method:'POST', headers:authHeaders });
      if (onResetOnboarding) onResetOnboarding();
    } catch(e) {
      console.error('Failed to reset onboarding:', e);
    }
  };

  const handleApprove = async (sid) => {
    try {
      const res = await fetch(`${API}/approve`, { method:'POST', headers:authHeaders, body:JSON.stringify({session_id:sid}) });
      const data = await res.json();
      // Mark the original approval card as resolved so the buttons disappear
      setMessages(prev => prev.map(m =>
        (m.session_id === sid && m.awaiting_approval)
          ? { ...m, awaiting_approval: false, approval_resolved: 'approved' }
          : m
      ));
      // Render the tool results as a structured card (no raw JSON)
      setMessages(prev => [...prev, {
        role: 'assistant',
        type: 'tool_result',
        content: '',
        tool_results: data.tool_results || [],
      }]);
    } catch(e) {
      console.error(e);
      setMessages(prev => [...prev, {
        role:'assistant', type:'system_note',
        content:"I couldn't complete that just now. Want to try again?"
      }]);
    }
  };

  const handleReject = async (sid) => {
    try {
      await fetch(`${API}/reject`, { method:'POST', headers:authHeaders, body:JSON.stringify({session_id:sid}) });
      setMessages(prev => prev.map(m =>
        (m.session_id === sid && m.awaiting_approval)
          ? { ...m, awaiting_approval: false, approval_resolved: 'rejected' }
          : m
      ));
      setMessages(prev => [...prev, {
        role:'assistant', type:'system_note',
        content:'No problem. How else can I help?'
      }]);
    } catch(e) { console.error(e); }
  };

  // Track whether we're mid-clarifying-flow (controls UI hints)
  const clarifyingActive = messages.length > 0 &&
    messages[messages.length - 1]?.role === 'assistant' &&
    messages[messages.length - 1]?.type === 'clarifying_question';

  // Build the full assistant message object from a final result payload
  const assistantMsgFromData = (data) => ({
    role:'assistant', type: data.type || 'answer', content: data.response,
    pillar: data.pillar, citations: data.citations, citation_chips: data.citation_chips,
    next_steps: data.next_steps, tools_to_call: data.tools_to_call,
    awaiting_approval: data.awaiting_approval, session_id: data.session_id,
    latency_ms: data.latency_ms, from_cache: data.from_cache, usage: data.usage,
    is_crisis: data.is_crisis, helplines: data.helplines,
    is_yes_no: data.is_yes_no, is_doc_request: data.is_doc_request,
    question_index: data.question_index, questions_total: data.questions_total,
    onApprove: handleApprove, onReject: handleReject,
  });

  // Fallback: classic non-streaming /chat (user bubble already shown)
  const submitValueNonStream = async (q) => {
    setThinkingSteps([{ step:'classifying', detail:'Thinking...' }]);
    try {
      const res = await fetch(`${API}/chat`, {
        method:'POST', headers:authHeaders,
        body:JSON.stringify({ user_id:userId, age_band:ageBand, query:q, session_id:sessionId }),
      });
      const data = await res.json();
      setMessages(prev => [...prev, assistantMsgFromData(data)]);
    } catch(e) {
      setMessages(prev => [...prev, { role:'assistant', content:'Sorry, something went wrong. Please try again.' }]);
    }
    setThinkingSteps([]);
  };

  const submitValue = async (rawValue) => {
    const q = (rawValue || '').toString().trim();
    if (!q || loading || !ageBand) return;
    setInput('');
    setShowGreeting(false);
    setMessages(prev => [...prev, { role:'user', content:q }]);
    setLoading(true);
    setThinkingSteps([{ step:'classifying', detail:'Thinking...' }]);

    const streamId = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()));
    let gotMeta = false, gotFinal = false;

    const handleEvent = (ev, dataStr) => {
      let data; try { data = JSON.parse(dataStr); } catch(e) { return; }
      if (ev === 'meta') {
        gotMeta = true;
        setThinkingSteps([]);
        setMessages(prev => [...prev, {
          role:'assistant', _streamId: streamId, _streaming: true,
          type: data.type || 'answer', content:'', pillar: data.pillar, session_id: data.session_id,
        }]);
      } else if (ev === 'token') {
        setMessages(prev => prev.map(m =>
          m._streamId === streamId ? { ...m, content:(m.content||'') + (data.t||'') } : m));
      } else if (ev === 'final') {
        gotFinal = true;
        setThinkingSteps([]);
        if (gotMeta) {
          setMessages(prev => prev.map(m => m._streamId === streamId
            ? { ...assistantMsgFromData(data), _streamId: streamId, _streaming: false,
                content: (data.response ?? m.content) }
            : m));
        } else {
          setMessages(prev => [...prev, assistantMsgFromData(data)]);
        }
      } else if (ev === 'error') {
        throw new Error(data.detail || 'stream error');
      }
    };

    try {
      const res = await fetch(`${API}/chat/stream`, {
        method:'POST', headers:authHeaders,
        body:JSON.stringify({ user_id:userId, age_band:ageBand, query:q, session_id:sessionId }),
      });
      if (!res.ok || !res.body) throw new Error('stream unavailable');

      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';
      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream:true });
        let sep;
        while ((sep = buffer.indexOf('\n\n')) !== -1) {
          const block = buffer.slice(0, sep); buffer = buffer.slice(sep + 2);
          let ev = 'message'; const dataLines = [];
          block.split('\n').forEach(line => {
            if (line.startsWith('event:')) ev = line.slice(6).trim();
            else if (line.startsWith('data:')) dataLines.push(line.slice(5).trim());
          });
          if (dataLines.length) handleEvent(ev, dataLines.join('\n'));
        }
      }
      if (!gotMeta && !gotFinal) throw new Error('empty stream');
    } catch(e) {
      console.warn('Streaming failed, falling back to /chat:', e);
      setMessages(prev => prev.filter(m => m._streamId !== streamId));
      await submitValueNonStream(q);
    }
    setLoading(false);
  };

  const sendMessage = async () => submitValue(input);

  // ── Voice: BCP-47 codes for speech recognition / synthesis ──
  const LANG_CODES = {
    English:'en-IN', Hindi:'hi-IN', Hinglish:'hi-IN', Tamil:'ta-IN',
    Telugu:'te-IN', Marathi:'mr-IN', Bengali:'bn-IN',
  };
  const langCode = LANG_CODES[language] || 'en-IN';

  const toggleListening = () => {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { alert("Voice input isn't supported in this browser. Please type instead."); return; }
    if (listening) { try { recognitionRef.current?.stop(); } catch(e){} return; }

    const rec = new SR();
    rec.lang = langCode;
    rec.interimResults = true;
    rec.continuous = false;
    recognitionRef.current = rec;
    let finalText = '';
    rec.onresult = (e) => {
      let interim = '';
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const t = e.results[i][0].transcript;
        if (e.results[i].isFinal) finalText += t; else interim += t;
      }
      setInput((finalText + interim).trim());
    };
    rec.onerror = () => setListening(false);
    rec.onend = () => setListening(false);
    setListening(true);
    try { rec.start(); } catch(e) { setListening(false); }
  };

  // ── Document upload handler for clarifying doc-requests ──
  const handleUpload = async (file) => {
    if (!file || loading) return;

    // Optimistic: show the user's attachment bubble immediately
    setMessages(prev => [...prev, {
      role: 'user', type: 'attachment_ack',
      content: `Shared ${file.name}`,
      filename: file.name,
    }]);
    setLoading(true);
    setThinkingSteps([{ step:'uploading', detail:'Receiving your document...' }]);

    try {
      const form = new FormData();
      form.append('file', file);
      form.append('session_id', sessionId);
      const res = await fetch(`${API}/attachments/upload`, {
        method: 'POST',
        headers: { 'Authorization': `Bearer ${idToken}` },
        body: form,
      });
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.detail || `Upload failed (${res.status})`);
      }
      const data = await res.json();

      // Kalpana acknowledges receipt
      setMessages(prev => [...prev, {
        role: 'assistant', type: 'system_note',
        content: data.ack || `Got it. Thanks for sharing ${data.filename || 'this'}.`,
      }]);

      // Backend already advanced the clarifying state and returned the next
      // question (or the final answer) in data.next — render it directly.
      const nxt = data.next;
      if (nxt && nxt.type === 'clarifying_question') {
        setMessages(prev => [...prev, {
          role: 'assistant',
          type: 'clarifying_question',
          content: nxt.response,
          question: nxt.question,
          is_yes_no: nxt.is_yes_no,
          is_doc_request: nxt.is_doc_request,
          question_index: nxt.question_index,
          questions_total: nxt.questions_total,
          pillar: nxt.pillar,
          session_id: nxt.session_id,
        }]);
      } else if (nxt && nxt.type === 'answer') {
        // Clarifying complete — show the final answer
        setMessages(prev => [...prev, {
          role: 'assistant',
          type: 'answer',
          content: nxt.response,
          pillar: nxt.pillar,
          citations: nxt.citations,
          citation_chips: nxt.citation_chips,
          next_steps: nxt.next_steps,
          tools_to_call: nxt.tools_to_call,
          awaiting_approval: nxt.awaiting_approval,
          session_id: nxt.session_id,
          latency_ms: nxt.latency_ms,
          from_cache: nxt.from_cache,
          onApprove: handleApprove,
          onReject: handleReject,
        }]);
      }
    } catch (e) {
      console.error('Upload failed:', e);
      setMessages(prev => [...prev, {
        role: 'assistant', type: 'system_note',
        content: e.message?.includes('size') || e.message?.includes('large')
          ? "That file is a bit too large — could you try one under 10 MB?"
          : "I couldn't receive that just now. Want to type your answer instead?",
      }]);
    } finally {
      setThinkingSteps([]);
      setLoading(false);
    }
  };

  const handleSkipUpload = () => {
    submitValue("I'll share later");
  };

  if (!profileLoaded) {
    return (
      <div className="flex items-center justify-center h-[calc(100vh-72px)]" style={{color:'var(--kalpana-text-soft)'}}>
        <div className="thinking-dot inline-block w-2 h-2 rounded-full mr-1" style={{background:'var(--kalpana-rose-500)'}}></div>
        <div className="thinking-dot inline-block w-2 h-2 rounded-full mr-1" style={{background:'var(--kalpana-rose-500)', animationDelay:'0.2s'}}></div>
        <div className="thinking-dot inline-block w-2 h-2 rounded-full mr-3" style={{background:'var(--kalpana-rose-500)', animationDelay:'0.4s'}}></div>
        Loading your profile...
      </div>
    );
  }

  const AGE_BANDS = ['11-24','25-40','41+'];

  return (
    <div className="flex flex-col h-[calc(100vh-72px)]" style={{background:'var(--kalpana-bg)'}}>
      {/* Subject Indicator (only in 'other' mode) */}
      {userMode === 'other' && preferredName && (
        <div className="px-4 py-2 text-sm flex items-center justify-center gap-2 flex-wrap"
          style={{background:'var(--kalpana-rose-50)', borderBottom:'1px solid var(--kalpana-rose-100)', color:'var(--kalpana-rose-700)'}}>
          <span>💕 Asking on behalf of <strong>{preferredName}</strong>{subjectLabel ? ` (${subjectLabel})` : ''}</span>
          <button onClick={handleSwitchMode} className="text-xs underline ml-1 hover:no-underline" style={{color:'var(--kalpana-rose-700)'}}>
            Switch
          </button>
        </div>
      )}

      {/* Age Band Selector + New chat */}
      <div className="flex items-center justify-between gap-2 py-3 px-3 sm:px-4" style={{borderBottom:'1px solid var(--kalpana-rose-100)', background:'white'}}>
        <div className="flex items-center justify-center gap-2 flex-1 flex-wrap">
          <span className="text-xs mr-1" style={{color:'var(--kalpana-text-soft)'}}>
            {userMode === 'other' ? `Her age:` : 'Age:'}
          </span>
          {AGE_BANDS.map(ab => (
            <button key={ab} onClick={() => setAgeBand(ab)}
              className="px-3 sm:px-4 py-1.5 rounded-full text-xs font-semibold transition-all"
              style={ageBand===ab
                ? {background:'var(--kalpana-rose-500)', color:'white', transform:'scale(1.05)', boxShadow:'0 4px 12px rgba(233, 78, 138, 0.25)'}
                : {background:'var(--kalpana-rose-50)', color:'var(--kalpana-rose-700)', border:'1px solid var(--kalpana-rose-100)'}}>
              {ab}
            </button>
          ))}
        </div>
        {messages.length > 0 && (
          <button onClick={handleNewConversation}
            className="text-xs px-2.5 py-1.5 rounded-lg transition flex-shrink-0 hover:bg-rose-50"
            style={{color:'var(--kalpana-rose-700)', border:'1px solid var(--kalpana-rose-100)'}}
            title="Start a new conversation">
            <span className="hidden sm:inline">+ New chat</span>
            <span className="sm:hidden">+ New</span>
          </button>
        )}
      </div>

      {/* Messages */}
      <div className="flex-1 overflow-y-auto px-4 py-4 space-y-4">
        {messages.length === 0 && !showGreeting && (
          <div className="flex flex-col items-center justify-center min-h-full text-center py-8 px-4 fade-in">
            <KalpanaLogo size={72}/>
            <h2 className="font-heading text-2xl sm:text-3xl mt-4" style={{color:'var(--kalpana-rose-700)'}}>
              Hi{preferredName ? `, ${preferredName}` : (user?.displayName ? `, ${user.displayName.split(' ')[0]}` : '')}. I'm Kalpana.
            </h2>
            <p className="mt-2 max-w-md text-sm" style={{color:'var(--kalpana-text-soft)'}}>
              Tell me what's on your mind today. I'm here to guide you across Health, Finance, and Career.
            </p>
            <div className="flex flex-wrap justify-center gap-2 sm:gap-3 mt-6">
              {Object.entries(PILLAR_STYLES).map(([k,v]) => (
                <span key={k} className={`kalpana-badge ${v.badge}`}>{v.icon} {v.label}</span>
              ))}
            </div>
            <TrustStrip/>
          </div>
        )}
        {showGreeting && greeting && (
          <GreetingCard greeting={greeting} onContinue={handleContinue} onStartFresh={handleStartFresh}/>
        )}
        {messages.map((m, i) => (
          <ChatMessage
            key={i}
            msg={m}
            isLatest={i === messages.length - 1}
            onQuickReply={submitValue}
            onPickNextStep={handlePickNextStep}
            onFeedback={handleFeedback}
            onUpload={handleUpload}
            onSkipUpload={handleSkipUpload}
            speakLang={langCode}
          />
        ))}
        {thinkingSteps.length > 0 && (
          <KalpanaThinking label={`Kalpana is ${thinkingSteps[thinkingSteps.length-1]?.detail?.replace(/\.\.\.$/, '').toLowerCase() || 'thinking'}`}/>
        )}
        <div ref={endRef}/>
      </div>

      {/* Trust Footer */}
      <div className="text-center text-xs py-2" style={{color:'var(--kalpana-text-soft)', borderTop:'1px solid var(--kalpana-rose-50)'}}>
        🔒 Verified information only · Your data is private and secure
      </div>

      {/* Input */}
      <div className="px-3 sm:px-4 py-3 sm:py-4" style={{background:'white', borderTop:'1px solid var(--kalpana-rose-100)'}}>
        <div className="flex gap-2 sm:gap-3 max-w-3xl mx-auto">
          <input ref={inputRef} value={input} onChange={e => setInput(e.target.value)}
            onKeyDown={e => e.key==='Enter' && sendMessage()}
            placeholder={listening ? "Listening… speak now" : (clarifyingActive ? "Type your answer..." : "Tell me what's on your mind today...")}
            className="flex-1 rounded-xl px-3 sm:px-4 py-3 text-sm focus:outline-none transition min-w-0"
            style={{background:'var(--kalpana-rose-50)', border:'1px solid var(--kalpana-rose-100)', color:'var(--kalpana-text)'}}/>
          <button onClick={toggleListening} title={listening ? 'Stop' : 'Speak'}
            className="flex-shrink-0 rounded-xl px-3 py-3 text-sm transition"
            style={listening
              ? {background:'var(--kalpana-rose-500)', color:'white', animation:'pulse 1s infinite'}
              : {background:'var(--kalpana-rose-50)', color:'var(--kalpana-rose-700)', border:'1px solid var(--kalpana-rose-100)'}}>
            {listening ? '⏹' : '🎤'}
          </button>
          <button onClick={sendMessage} disabled={loading || !input.trim()}
            className="kalpana-btn-primary text-sm disabled:opacity-30 disabled:cursor-not-allowed flex-shrink-0">
            {loading ? '...' : 'Send'}
          </button>
        </div>
      </div>
    </div>
  );
}

// DASHBOARD VIEW
// ═══════════════════════════════════════
function DashboardView() {
  const [data, setData] = useState(null);
  const pillarChartRef = useRef(null);
  const ageChartRef = useRef(null);
  const latencyChartRef = useRef(null);
  const chartsRef = useRef({});

  const fetchMetrics = useCallback(async () => {
    try {
      const res = await fetch(`${API}/metrics`);
      setData(await res.json());
    } catch(e) { console.error(e); }
  }, []);

  useEffect(() => { fetchMetrics(); const iv = setInterval(fetchMetrics, 5000); return () => clearInterval(iv); }, [fetchMetrics]);

  useEffect(() => {
    if (!data) return;
    // Pillar Pie
    if (pillarChartRef.current) {
      if (chartsRef.current.pillar) chartsRef.current.pillar.destroy();
      chartsRef.current.pillar = new Chart(pillarChartRef.current, {
        type:'doughnut', data:{
          labels:['Health','Finance','Career'],
          datasets:[{ data:[data.pillar_split.HEALTH||0, data.pillar_split.FINANCE||0, data.pillar_split.CAREER||0],
            backgroundColor:['#e94e8a','#f4c785','#a7c4a0'], borderWidth:0 }]
        }, options:{ plugins:{legend:{labels:{color:'#6b5560',font:{size:11}}}}, cutout:'65%' }
      });
    }
    // Age Pie
    if (ageChartRef.current) {
      if (chartsRef.current.age) chartsRef.current.age.destroy();
      chartsRef.current.age = new Chart(ageChartRef.current, {
        type:'doughnut', data:{
          labels:['11-24','25-40','41+'],
          datasets:[{ data:[data.age_band_split['11-24']||0, data.age_band_split['25-40']||0, data.age_band_split['41+']||0],
            backgroundColor:['#f9a8c3','#e94e8a','#b03168'], borderWidth:0 }]
        }, options:{ plugins:{legend:{labels:{color:'#6b5560',font:{size:11}}}}, cutout:'65%' }
      });
    }
    // Latency Line
    if (latencyChartRef.current) {
      if (chartsRef.current.latency) chartsRef.current.latency.destroy();
      const hist = data.latency_history || [];
      chartsRef.current.latency = new Chart(latencyChartRef.current, {
        type:'line', data:{
          labels:hist.map((_,i) => i+1),
          datasets:[{ label:'Latency (ms)', data:hist.map(h=>h.ms), borderColor:'#e94e8a', backgroundColor:'rgba(233,78,138,0.1)', fill:true, tension:0.4, pointRadius:2 }]
        }, options:{ scales:{ x:{ticks:{color:'#6b5560'},grid:{color:'rgba(233,78,138,0.05)'}}, y:{ticks:{color:'#6b5560'},grid:{color:'rgba(233,78,138,0.05)'}} }, plugins:{legend:{labels:{color:'#6b5560'}}} }
      });
    }
  }, [data]);

  if (!data) return <div className="flex items-center justify-center h-[calc(100vh-72px)]" style={{color:'var(--kalpana-text-soft)'}}>Loading metrics...</div>;

  const fmtUsd = (n) => {
    const v = Number(n || 0);
    if (v === 0) return '$0';
    if (v < 0.01) return `$${v.toFixed(5)}`;
    return `$${v.toFixed(4)}`;
  };
  const fmtNum = (n) => Number(n || 0).toLocaleString();
  const cards = [
    { label:'Total Sessions', value:data.total_sessions, icon:'📊', color:'var(--kalpana-rose-700)' },
    { label:'Avg Latency', value:`${data.avg_latency_ms}ms`, icon:'⚡', color:'#b8772b' },
    { label:'Avg Cost/Session', value:fmtUsd(data.avg_cost_per_session), icon:'💵', color:'#4a7a3f' },
    { label:'Total Cost', value:fmtUsd(data.total_cost_usd), icon:'🧾', color:'#4a7a3f' },
    { label:'Avg Tokens/Session', value:fmtNum(data.avg_tokens_per_session), icon:'🔢', color:'#6d4ed4' },
    { label:'Total Tokens', value:fmtNum(data.total_tokens), icon:'🪙', color:'#6d4ed4' },
    { label:'Hallucination Rate', value:`${(data.hallucination_rate*100).toFixed(1)}%`, icon:'🛡️', color:'var(--kalpana-rose-500)' },
  ];

  return (
    <div className="p-6 max-w-6xl mx-auto space-y-6 overflow-y-auto h-[calc(100vh-72px)]">
      <h2 className="font-heading text-2xl" style={{color:'var(--kalpana-rose-700)'}}>Dashboard</h2>
      {/* Stat Cards */}
      <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
        {cards.map((c,i) => (
          <div key={i} className="kalpana-card p-4 transition hover:-translate-y-0.5">
            <div className="text-2xl mb-1">{c.icon}</div>
            <div className="text-2xl font-bold font-heading" style={{color:c.color}}>{c.value}</div>
            <div className="text-xs mt-1" style={{color:'var(--kalpana-text-soft)'}}>{c.label}</div>
          </div>
        ))}
      </div>
      {/* Approval Gauge */}
      <div className="kalpana-card p-4">
        <div className="text-sm mb-2" style={{color:'var(--kalpana-text-soft)'}}>Approval Rate</div>
        <div className="w-full rounded-full h-4 overflow-hidden" style={{background:'var(--kalpana-rose-50)'}}>
          <div className="h-full rounded-full transition-all duration-700" style={{width:`${(data.approval_rate*100)}%`, background:'linear-gradient(to right, var(--kalpana-rose-500), var(--kalpana-rose-700))'}}></div>
        </div>
        <div className="text-right text-xs mt-1" style={{color:'var(--kalpana-text-soft)'}}>{(data.approval_rate*100).toFixed(0)}%</div>
      </div>
      {/* Charts */}
      <div className="grid md:grid-cols-3 gap-4">
        <div className="kalpana-card p-4"><div className="text-sm mb-3 font-heading" style={{color:'var(--kalpana-rose-700)'}}>Pillar Distribution</div><canvas ref={pillarChartRef}></canvas></div>
        <div className="kalpana-card p-4"><div className="text-sm mb-3 font-heading" style={{color:'var(--kalpana-rose-700)'}}>Age Band Distribution</div><canvas ref={ageChartRef}></canvas></div>
        <div className="kalpana-card p-4"><div className="text-sm mb-3 font-heading" style={{color:'var(--kalpana-rose-700)'}}>Latency Over Time</div><canvas ref={latencyChartRef}></canvas></div>
      </div>
    </div>
  );
}

// TRACE VIEWER

function TraceView() {
  const [sessions, setSessions] = useState([]);
  const [expanded, setExpanded] = useState(null);
  const [userId, setUserId] = useState('');

  const fetchSessions = async (uid) => {
    if (!uid) return;
    try {
      const res = await fetch(`${API}/sessions/${uid}`);
      const data = await res.json();
      setSessions(data.sessions || []);
    } catch(e) { console.error(e); }
  };

  return (
    <div className="p-6 max-w-5xl mx-auto overflow-y-auto h-[calc(100vh-72px)]">
      <h2 className="font-heading text-2xl mb-4" style={{color:'var(--kalpana-rose-700)'}}>Trace Viewer</h2>
      <div className="flex gap-3 mb-6">
        <input value={userId} onChange={e=>setUserId(e.target.value)} placeholder="Enter user_id..."
          className="flex-1 rounded-lg px-3 py-2 text-sm focus:outline-none transition"
          style={{background:'white', border:'1px solid var(--kalpana-rose-100)', color:'var(--kalpana-text)'}}/>
        <button onClick={()=>fetchSessions(userId)} className="kalpana-btn-primary text-sm">Load</button>
      </div>
      {sessions.length === 0 ? (
        <div className="text-center py-12" style={{color:'var(--kalpana-text-soft)'}}>No sessions found. Enter a user ID and click Load.</div>
      ) : (
        <div className="space-y-2">
          {sessions.slice(-10).reverse().map((s,i) => {
            const ps = PILLAR_STYLES[s.pillar] || {};
            return (
              <div key={i} className="kalpana-card overflow-hidden">
                <button onClick={()=>setExpanded(expanded===i?null:i)} className="w-full px-3 sm:px-4 py-3 flex items-center gap-2 sm:gap-4 text-left transition hover:bg-rose-50">
                  <span className="hidden sm:inline text-xs font-mono w-16" style={{color:'var(--kalpana-text-soft)'}}>{new Date(s.timestamp*1000).toLocaleTimeString()}</span>
                  <span className={`kalpana-badge ${ps.badge || ''}`}>{s.pillar||'—'}</span>
                  <span className="hidden sm:inline text-xs" style={{color:'var(--kalpana-text-soft)'}}>{s.age_band}</span>
                  <span className="text-xs flex-1 truncate min-w-0" style={{color:'var(--kalpana-text-soft)'}}>{s.response_preview}</span>
                  <span className="hidden sm:inline text-xs" style={{color:'#b8772b'}}>{s.latency_ms?.toFixed(0)}ms</span>
                  <span className="hidden md:inline text-xs" style={{color:'var(--kalpana-text-soft)'}}>{s.citations_count||0} cites</span>
                  <span className="text-xs" style={{color:s.approved===true?'#4a7a3f':s.approved===false?'#b03168':'var(--kalpana-text-soft)'}}>{s.approved===true?'✓':s.approved===false?'✕':'—'}</span>
                </button>
                {expanded===i && (
                  <div className="px-4 pb-4 text-xs space-y-2 pt-3 fade-in" style={{borderTop:'1px solid var(--kalpana-rose-100)'}}>
                    <div><span style={{color:'var(--kalpana-text-soft)'}}>Session:</span> <span className="font-mono">{s.session_id}</span></div>
                    <div><span style={{color:'var(--kalpana-text-soft)'}}>Query:</span> <span>{s.query || '—'}</span></div>
                    <div><span style={{color:'var(--kalpana-text-soft)'}}>Response:</span> <span>{s.response_preview}</span></div>
                    {s.trace_url && <a href={s.trace_url} target="_blank" rel="noopener" className="inline-block mt-1 hover:underline" style={{color:'var(--kalpana-rose-500)'}}>View in Langfuse →</a>}
                  </div>
                )}
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

// ═══════════════════════════════════════
// AUTH HOOK
// ═══════════════════════════════════════
function useAuth() {
  const [user, setUser] = useState(null);
  const [idToken, setIdToken] = useState(() => localStorage.getItem('shakti_token'));
  const [authReady, setAuthReady] = useState(false);

  useEffect(() => {
    const initAuth = () => {
      if (!window.__shakti_auth) {
        setTimeout(initAuth, 100);
        return;
      }
      const { auth, onAuthStateChanged } = window.__shakti_auth;
      onAuthStateChanged(auth, async (firebaseUser) => {
        if (firebaseUser) {
          setUser(firebaseUser);
          const token = await firebaseUser.getIdToken();
          setIdToken(token);
          localStorage.setItem('shakti_token', token);
        } else {
          setUser(null);
          setIdToken(null);
          localStorage.removeItem('shakti_token');
        }
        setAuthReady(true);
      });
    };
    initAuth();
  }, []);

  const signIn = async () => {
    if (!window.__shakti_auth) return;
    const { auth, provider, signInWithPopup } = window.__shakti_auth;
    try {
      await signInWithPopup(auth, provider);
    } catch (e) {
      console.error('Sign-in failed:', e);
    }
  };

  const signOutUser = async () => {
    if (!window.__shakti_auth) return;
    const { auth, signOut } = window.__shakti_auth;
    try {
      await signOut(auth);
    } catch (e) {
      console.error('Sign-out failed:', e);
    }
  };

  return { user, idToken, authReady, signIn, signOut: signOutUser };
}

        <p className="text-sm mb-1 italic" style={{color:'var(--kalpana-text-soft)'}}>Guiding Dreams, Empowering Decisions</p>

        <button onClick={onSignIn}

          <svg className="w-5 h-5" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
          Sign in with Google
        </button>
        <p className="text-[11px] mt-4" style={{color:'var(--kalpana-text-soft)'}}>🔒 Your data is private and secure.</p>
      </div>
      <TrustStrip/>
    </div>
  );
}

// ═══════════════════════════════════════
// APP ROOT
// ═══════════════════════════════════════
function App() {
  const [tab, setTab] = useState('chat');
  const { user, idToken, authReady, signIn, signOut } = useAuth();
  const [onboardingComplete, setOnboardingComplete] = useState(null); // null = not checked yet
  const [checkingOnboarding, setCheckingOnboarding] = useState(false);
  const tabs = [
    { id:'chat', label:'Chat', icon:'💬' },
    { id:'dashboard', label:'Dashboard', icon:'📊' },
    { id:'traces', label:'Traces', icon:'🔍' },
  ];

  // Check onboarding state when user signs in
  useEffect(() => {
    if (user && idToken) {
      checkOnboarding();
    } else {
      setOnboardingComplete(null);
    }
  }, [user, idToken]);

  const checkOnboarding = async () => {
    setCheckingOnboarding(true);
    try {
      const res = await fetch(`${API}/onboarding/state`, {
        headers: { 'Authorization': `Bearer ${idToken}` }
      });
      const data = await res.json();
      setOnboardingComplete(data.complete);
    } catch(e) {
      console.error('Failed to check onboarding:', e);
      setOnboardingComplete(true); // Default to complete on error
    }
    setCheckingOnboarding(false);
  };

  const handleOnboardingComplete = () => {
    setOnboardingComplete(true);
  };

  const handleResetOnboarding = () => {
    setOnboardingComplete(false);
  };

  const renderChatContent = () => {
    if (!authReady) {
      return (
        <div className="flex items-center justify-center h-[calc(100vh-72px)]" style={{color:'var(--kalpana-text-soft)'}}>
          <div className="thinking-dot inline-block w-2 h-2 rounded-full mr-1" style={{background:'var(--kalpana-rose-500)'}}></div>
          <div className="thinking-dot inline-block w-2 h-2 rounded-full mr-1" style={{background:'var(--kalpana-rose-500)', animationDelay:'0.2s'}}></div>
          <div className="thinking-dot inline-block w-2 h-2 rounded-full mr-3" style={{background:'var(--kalpana-rose-500)', animationDelay:'0.4s'}}></div>
          Loading...
        </div>
      );
    }

    if (!user) {
      return <SignInPrompt onSignIn={signIn}/>;
    }

    if (checkingOnboarding || onboardingComplete === null) {
      return (
        <div className="flex items-center justify-center h-[calc(100vh-72px)]" style={{color:'var(--kalpana-text-soft)'}}>
          <div className="thinking-dot inline-block w-2 h-2 rounded-full mr-1" style={{background:'var(--kalpana-rose-500)'}}></div>
          <div className="thinking-dot inline-block w-2 h-2 rounded-full mr-1" style={{background:'var(--kalpana-rose-500)', animationDelay:'0.2s'}}></div>
          <div className="thinking-dot inline-block w-2 h-2 rounded-full mr-3" style={{background:'var(--kalpana-rose-500)', animationDelay:'0.4s'}}></div>
          Loading...
        </div>
      );
    }

    if (!onboardingComplete) {
      return <OnboardingView idToken={idToken} onComplete={handleOnboardingComplete}/>;
    }

    return <ChatView idToken={idToken} user={user} onResetOnboarding={handleResetOnboarding}/>;
  };

  return (
    <div className="min-h-screen" style={{background:'var(--kalpana-bg)'}}>
      {/* Header */}
      <header className="sticky top-0 z-50" style={{background:'white', borderBottom:'1px solid var(--kalpana-rose-100)', boxShadow:'0 2px 8px rgba(233, 78, 138, 0.04)'}}>
        <div className="max-w-6xl mx-auto flex items-center justify-between px-3 sm:px-4 h-[64px] sm:h-[72px] gap-2">
          <div className="flex items-center gap-2 sm:gap-3 min-w-0">
            <KalpanaLogo size={32}/>
            <div className="min-w-0">
              <h1 className="font-heading text-xl sm:text-2xl leading-tight" style={{color:'var(--kalpana-rose-700)'}}>Kalpana</h1>
              <p className="hidden sm:block text-[10px] tracking-wider italic" style={{color:'var(--kalpana-text-soft)'}}>Guiding Dreams, Empowering Decisions</p>
            </div>
          </div>
          <div className="flex items-center gap-1.5 sm:gap-3">
            <button
              onClick={() => { try { window.location.replace('https://www.google.com'); } catch(e) { window.location.href = 'https://www.google.com'; } }}
              title="Quickly leave this page"
              className="px-2.5 py-1.5 rounded-lg text-xs font-semibold transition-all flex items-center gap-1"
              style={{background:'#fbe9e9', color:'#b03168', border:'1px solid #f0c4cf'}}>
              <span>✕</span><span className="hidden sm:inline">Quick exit</span>
            </button>
            <nav className="flex gap-1">
              {tabs.map(t => (
                <button key={t.id} id={`nav-${t.id}`} onClick={()=>setTab(t.id)}
                  className="px-2.5 sm:px-4 py-2 rounded-lg text-sm font-medium transition-all"
                  title={t.label}
                  style={tab===t.id
                    ? {background:'var(--kalpana-rose-50)', color:'var(--kalpana-rose-700)', border:'1px solid var(--kalpana-rose-100)'}
                    : {color:'var(--kalpana-text-soft)', background:'transparent'}}>
                  <span>{t.icon}</span>
                  <span className="hidden sm:inline ml-1">{t.label}</span>
                </button>
              ))}
            </nav>
            {/* Auth Button */}
            {authReady && (
              user ? (
                <div className="flex items-center gap-1.5 sm:gap-2 ml-1 sm:ml-2 pl-2 sm:pl-3" style={{borderLeft:'1px solid var(--kalpana-rose-100)'}}>
                  <img src={user.photoURL} alt="" className="w-7 h-7 rounded-full" style={{border:'1px solid var(--kalpana-rose-300)'}}/>
                  <button onClick={signOut} className="hidden sm:inline-block text-xs transition px-2 py-1 rounded hover:bg-rose-50"
                    style={{color:'var(--kalpana-text-soft)'}} title="Sign out">
                    Sign out
                  </button>
                </div>
              ) : (
                <button onClick={signIn}
                  className="ml-1 sm:ml-2 px-2.5 sm:px-4 py-2 rounded-lg text-xs font-medium transition-all flex items-center gap-1.5 sm:gap-2"
                  style={{background:'white', color:'var(--kalpana-text)', border:'1.5px solid var(--kalpana-rose-300)'}}>
                  <svg className="w-4 h-4" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
                  <span className="hidden sm:inline">Sign in</span>
                </button>
              )
            )}
          </div>
        </div>
      </header>

      {/* Views */}
      {tab === 'chat' && renderChatContent()}
      {tab === 'dashboard' && <DashboardView/>}
      {tab === 'traces' && <TraceView/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
