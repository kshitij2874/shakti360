steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/shakti-repo/shakti-agent:$SHORT_SHA'
      - '-t'
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/shakti-repo/shakti-agent:latest'
      - '.'

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '--all-tags', 'asia-south1-docker.pkg.dev/$PROJECT_ID/shakti-repo/shakti-agent']

  - name: 'gcr.io/google.cloud-sdk/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'shakti-agent'
      - '--image=asia-south1-docker.pkg.dev/$PROJECT_ID/shakti-repo/shakti-agent:$SHORT_SHA'
      - '--region=asia-south1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--memory=2Gi'
      - '--cpu=2'
      - '--timeout=300'
      - '--service-account=shakti-agent-sa@$PROJECT_ID.iam.gserviceaccount.com'
      - '--update-secrets=MAPS_API_KEY=MAPS_API_KEY:latest,LANGFUSE_PUBLIC_KEY=LANGFUSE_PUBLIC_KEY:latest,LANGFUSE_SECRET_KEY=LANGFUSE_SECRET_KEY:latest'
      - '--set-env-vars=PROJECT_ID=$PROJECT_ID,LOCATION=asia-south1,VERTEX_LOCATION=us-central1,GEMINI_MODEL=gemini-2.5-flash,LANGFUSE_HOST=https://cloud.langfuse.com,RAG_BUCKET=shakti360-rag,USE_MEDGEMMA=false'

images:
  - 'asia-south1-docker.pkg.dev/$PROJECT_ID/shakti-repo/shakti-agent:$SHORT_SHA'
  - 'asia-south1-docker.pkg.dev/$PROJECT_ID/shakti-repo/shakti-agent:latest'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'

timeout: '1200s'
